[package]
name = "device-core"
version = "0.1.0"
description = "Device execution core for the Neore desktop shell: envelopes, approvals, sandboxed shell, local MCP. No UI."
authors = ["Daniel Bannert"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "device_core"
path = "src/lib.rs"

# The headless host the desktop drives over a pipe (`host.rs`). Build it with `--no-default-features`: it holds no
# pairing, so it links no keyring (and on Linux no libdbus).
[[bin]]
name = "neore-host"
path = "src/bin/neore-host.rs"

[features]
default = ["keychain"]
# The paired-device side: envelopes, approvals, the engine and the pairing store (the secret lives in the OS
# keychain). `actions`, `fs`, `shell` and `sandbox` build without it.
keychain = ["dep:keyring"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# The `shell_run` sandbox (`sandbox.rs`) and the process-group kill (`shell.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"
# The pairing secret (`store.rs`) in the Secret Service keyring.
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"], optional = true }

# The pairing secret (`store.rs`) in the macOS keychain.
[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"], optional = true }

[target.'cfg(windows)'.dependencies]
# The pairing secret (`store.rs`) in the Windows credential store.
keyring = { version = "3", features = ["windows-native"], optional = true }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_JobObjects", "Win32_System_Threading"] }

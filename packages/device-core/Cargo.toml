[package]
name = "device-core"
version = "0.1.0"
description = "Device execution core for the Neore desktop shell: envelopes, approvals, sandboxed shell, local MCP. No UI."
authors = ["Daniel Bannert"]
license = "MIT"
edition = "2021"
publish = false

[lib]
name = "device_core"
path = "src/lib.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

# The `shell_run` sandbox (`sandbox.rs`) and the process-group kill (`shell.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
landlock = "0.4.7"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading"] }

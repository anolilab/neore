[package]
name = "device-core-node"
version = "0.1.0"
authors = ["Daniel Bannert"]
license = "MIT"
edition = "2021"
publish = false
description = "N-API addon around device-core for the Electron shell (apps/desktop)"

[lib]
crate-type = ["cdylib"]

[dependencies]
device-core = { path = "../device-core" }
napi = { version = "3", default-features = false, features = ["napi8", "tokio_rt"] }
napi-derive = "3"
serde = "1"
serde_json = "1"

[build-dependencies]
napi-build = "2"

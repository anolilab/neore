packages:
  - "apps/*"
  - "backend"
  - "packages/*"
  - "tools/*"
  - "services/*"

auditConfig:
  # Only advisories with NO published fix belong here. Everything else is
  # patched through `overrides` above, because an ignore entry outlives the
  # reason for it: nine of the eleven that used to sit here were Next.js, and
  # eight of those did not even apply to the installed 16.x — they were written
  # against `< 15.5.21`. The ninth was live and suppressed.
  ignoreGhsas:
    # braces <=3.0.3, via micromatch/fast-glob (28 paths). No patched release exists.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js <=1.1.3, via argparse 1 under `mammoth`. No patched release exists.
    - GHSA-86w9-cpqp-85rv
    # zod <4.6.6 has no patched 3.x release. The only zod 3 copy left is the one
    # eslint-plugin-react-compiler calls through its zod 3 API (it breaks on zod 4),
    # at lint time only. The MCP packages, @cloudflare/sandbox (see the overrides)
    # and the product use zod 4.6.7.
    - GHSA-mrhx-c7xc-m3w5
    # deepmerge >=4.2.0 <=4.3.1. No patched release exists. At run time it comes only
    # through html-to-text under @react-email/render (via @lunora/mail, and via
    # @lunora/notify > @visulima/email), which merges its own option objects, never
    # input; the other users (Expo config, rollup, shadcn) are build tools.
    - GHSA-gcqx-w48m-w2h4
    # minimatch <11.0.1 and glob >=9 <=14.0.1 are fixed only in new majors (minimatch
    # 11, glob 14). Their consumers ask for minimatch 3/9/10 (3 kept CJS on purpose,
    # see the overrides) and glob 10–13: rimraf, workbox-build, commitizen and eslint at
    # build or dev time, and the backend's e2b, which loads glob only by a dynamic import
    # inside its template builder (`Template.build`). The backend creates sandboxes and
    # never builds a template, and no pattern comes from user input. Drop these once
    # those dependencies move up.
    - GHSA-g3hv-75wg-m249
    - GHSA-3g3m-2fjr-6pw4

# OFF: auto-installing peers materialised Next.js — which nothing here uses — as
# the peer of fumadocs, geist, better-auth, @visulima/pail and friends, and its
# advisories then failed `pnpm audit`. Required peers are declared by the
# workspace package that needs them instead.
autoInstallPeers: false

blockExoticSubdeps: true
catalogMode: prefer

catalogs:
  # Lunora — type-safe realtime backend on Cloudflare.
  # Alpha channel: every package releases independently via semantic-release,
  # so these versions are intentionally not in lockstep. Bump with
  # `npm view <pkg> dist-tags.alpha`.

  ai:

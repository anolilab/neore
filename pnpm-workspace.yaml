    "@ai-sdk/provider": 4.0.27
    "@ai-sdk/provider-utils": 5.0.59
    # Moves with `ai` below: each release depends on exactly one `ai`.
    "@ai-sdk/react": 4.0.142
    "@ai-sdk/replicate": 3.0.60
    "@ai-sdk/xai": 5.0.21
    "@e2b/code-interpreter": 2.9.1
    "@openrouter/ai-sdk-provider": 3.1.0
    "@requesty/ai-sdk": 3.6.4
    # Held at 7.0.139: 7.0.140–7.0.164 (gateway 4.0.113+) make the backend's agent
    # types exceed what tsc can represent (TS2590 in lunora/agent/client and
    # chat/lib/get-agent.ts). 7.0.165 typechecks clean; take it once it passes
    # `minimumReleaseAge`. The whole @ai-sdk/* set moves with it: each provider
    # release depends on exactly one provider/provider-utils (5.0.59 here), and a
    # second copy of those splits FlexibleSchema/Tool types in lunora/agent/client.
    # 7.0.16x adds the finish reason "interrupted": add it to `vFinishReason`
    # (backend/lunora/agent/validators.ts) in the same change.
    ai: 7.0.139
    e2b: 2.63.0
    ollama-ai-provider-v2: 4.1.0
    workers-ai-provider: 4.0.1

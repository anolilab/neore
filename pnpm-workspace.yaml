  # release, pinned with its plugins so the pair stays matched (1.7.x is not a day old yet).
  seroval-plugins@<1.6.11: 1.6.11
  seroval@<1.6.11: 1.6.11
  sharp@<0.35.5: ">=0.35.5"
  shell-quote@<=1.8.4: ">=1.9.0"
  shell-quote@>=1.1.0 <=1.8.3: ">=1.8.4"
  shiki: 4.5.0
  smol-toml@<=1.8.0: ">=1.9.0 <2.0.0"
  svelte@<=5.55.6: 5.55.10
  svgo@>=4.0.0 <4.0.2: ">=4.0.2"
  # Windows command injection in services(); only reached through dev tooling.
  systeminformation@<5.33.16: ">=5.33.16"
  tar-fs@>=2.0.0 <2.1.4: ">=3.1.1"
  tar@<=7.5.20: ">=7.5.21"
  tar@<=7.5.3: ">=7.5.4"
  tmp@<0.2.6: ">=0.2.6"
  undici: ">=7.29.0"
  undici@<6.24.0: ">=6.24.0"
  undici@>=7.0.0 <7.24.0: ">=7.24.0"
  undici@>=7.0.0 <7.29.0: ">=7.29.0"
  uuid@<11.1.1: ">=11.1.1"
  uuid@>=13.0.0 <13.0.1: ">=13.0.1"
  valibot@<1.4.2: ">=1.4.2"
  vite@>=8.0.0 <8.0.16: ">=8.0.16"
  webpack@>=5.49.0 <=5.104.0: ">=5.104.1"
  ws@>=8.0.0 <8.20.1: ">=8.20.1"
  ws@>=8.0.0 <8.21.0: ">=8.21.0"
  # A direct tarball: its lockfile entry MUST carry an `integrity`, or every
  # install fails with ERR_PNPM_MISSING_TARBALL_INTEGRITY. pnpm 10.34.5's
  # `dedupe` and 11.4's `install` dropped it; on 11.28.2 and 12.8.1 `install`,
  # `dedupe`, a from-scratch resolve and `install --frozen-lockfile` all keep it
  # (checked 2026-10-02). If it ever goes missing again, restore `integrity: sha512-oLDq3jw7AcLqKWH2AhCpVTZl8mf6X2YReP+Neh0SJUzV/BdZYjth94tG5toiMB1PPrYtxOCfaoUCkvtuH+3AJA==`
  # (sha512 of the tarball) in the `xlsx@https://…` resolution. It is also in
  # `trustPolicyExclude`, because it has no registry publish time.
  xlsx: "https://cdn.sheetjs.com/xlsx-0.20.3/xlsx-0.20.3.tgz"
  yaml@>=1.0.0 <1.10.3: ">=1.10.3"
  yauzl@<3.2.1: ">=3.2.1"
  body-parser@>=2.0.0 <2.4.0: ^2.4.0
  fast-uri@>=3.0.0 <3.1.9: ^3.1.9
  postal-mime@>=3.0.0 <4.0.8: ^4.0.8
  serialize-javascript@<7.1.3: ^7.1.3
  undici@>=8.0.0 <8.12.2: ^8.12.2
  # miniflare pins undici exactly, and the bare `undici` floor above keeps that pin.
  miniflare>undici: ^8.12.2
  # Other tools that pin undici exactly to 8.11.2.
  "@ai-sdk/provider-utils>undici": ^8.12.2
  "@dotenvx/dotenvx>undici": ^8.12.2
  "@shadcn/registry>undici": ^8.12.2
  # MCP packages that resolve zod 3 for the product. The SDK already has a zod 4 peer variant.
  "@mcp-ui/client>zod": ^4.6.7
  "@modelcontextprotocol/ext-apps>zod": ^4.6.7
  "@modelcontextprotocol/sdk>zod": ^4.6.7
  # @cloudflare/sandbox 1.0.0 pins zod 4.5.4 exactly (GHSA-mrhx-c7xc-m3w5, fixed in 4.6.6).
  "@cloudflare/sandbox>zod": ^4.6.7
  shadcn>undici: ^8.12.2
  ajv>fast-uri: ^3.1.9
shellEmulator: true

trustPolicy: no-downgrade

# `xlsx` is the SheetJS CDN tarball pinned in `overrides`, not a registry
# package, so it has no publish `time`; since pnpm 11 the trust check rejects
# that (ERR_PNPM_TRUST_DOWNGRADE "Missing time for version 0.20.3") and fails
# every install.
trustPolicyExclude:
  - xlsx
  # pnpm 12.8.1 rejects this release as a "high-risk trust downgrade", although it,
  # like every release since 0.12, is published by the same GitHub trusted publisher
  # with provenance (checked against the registry). Drop it when bumping tsrs.
  - "tsrs@0.23.0-ts7.1.0-beta"

trustPolicyIgnoreAfter: 1440
patchedDependencies:
  expo-speech-recognition@58.0.1: patches/expo-speech-recognition@58.0.1.patch

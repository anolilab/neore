minimumReleaseAge: 1440

# First-party Visulima packages are exempted from the 24h maturation window so the
# toolchain (vis, packem, dev-toolbar, …) can be tracked at latest. The window
# still applies to every other dependency. Remove an entry here if a package
# stops being first-party.
#
# Lunora (anolilab/lunora) is exempted on the same first-party grounds: it is the
# backend framework and its alpha channel publishes several times a day, so the
# 24h window would pin us to a version that no longer exists by the time it
# matures. Revisit once Lunora reaches a stable `latest` channel — at that point
# the window becomes cheap again and these entries should be removed.
minimumReleaseAgeExclude:
  - "@visulima/*"
  - "@lunora/*"
  - "lunorash"

# pnpm 11 replaced onlyBuiltDependencies with this map (true = may run its
# build scripts). `strictDepBuilds` is on by default since 11, so a NEW
# dependency with an install script fails `pnpm install` until it is listed
# here as true or false. Keep the values booleans: pnpm 12.8.1 parses a version
# string here without complaint and then treats it as NOT approved, so a bulk
# version edit that rewrites `sharp: true` to `sharp: 0.35.5` fails the next
# install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@modelcontextprotocol/ext-apps": true
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  canvas: true
  classic-level: true
  core-js: true
  cpu-features: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msgpackr-extract: true
  msw: true
  oxc-resolver: true
  prisma: true
  protobufjs: true
  rs-module-lexer: true
  sharp: true
  sqlite3: true
  ssh2: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

overrides:
  # GHSA-4x5r-pxfx-6jf8. Kept inside 7.x deliberately: 8.0.1 is also in the tree
  # and the react-compiler plugin is pinned to 7.x on purpose (see the
  # `@babel/types` note above), so an unconditional `>=7.29.6` would resolve to
  # 8.x and split that arrangement.
  "@babel/core@<7.29.6": 7.29.7
  "@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3": ">=7.29.4"
  # Babel 7's traverse gets the Babel 7 types it was built for. The React
  # Compiler checks patterns with `path.isLVal()`, which @babel/traverse answers
  # from ITS @babel/types; under the global 8.0.4 override that dropped
  # `AssignmentPattern` from `LVal`, so every function with a destructuring
  # default bailed out of the compiler — measured 2026-09-25 at 454 of 1688 in
  # apps/web + packages/ui + packages/chat-ui (MessageItem, MessageList, …).
  # Scoped to traverse@7: lingui's `@babel/types` peer is untouched, so the
  # single-lingui-instance guarantee below still holds. Check a component in the
  # served dev module: compiled code starts with `const $ = _c(n)`.
  "@babel/traverse@7>@babel/types": 7.29.8
  # Pin ONE copy, and keep it in step with the `better-auth` catalog entry —
  # each release depends on the same core version, so leaving this at an older version splits core
  # into two peer-hashed instances and `BetterAuthPlugin` stops being assignable
  # (nine errors in `lunora/auth.ts` naming none of our own properties).
  # `@babel/types` is a peer of `@lingui/react`, and two copies of it split
  # lingui into two peer-hashed instances — which means TWO React contexts.
  # `apps/web` mounts `I18nProvider` on one and `packages/ui` calls `useLingui()`
  # against the other, so the hook returns null and any UI component using it
  # crashes with "Cannot destructure property ... as it is null". The data grid
  # was the visible casualty. One copy only.
  "@babel/types": 8.0.6
  "@better-auth/core": 1.7.7
  "@eslint/plugin-kit@<0.3.3": ">=0.5.0"
  "@grpc/grpc-js@<1.14.5": ">=1.14.5"
  "@hono/node-server@<1.19.10": ">=1.19.10"
  "@hono/node-server@<2.0.10": ">=2.0.10"
  "@humanfs/node@<0.16.8": ">=0.16.8"
  "@langchain/core@<0.3.80": ">=0.3.80"
  # @lunora/auth@alpha.63 peer-depends on better-auth 1.7.0-rc.2; the catalog now
  # matches. The override still pins ONE copy of @better-auth/core, because:
  # Two copies of `BetterAuthPlugin` are structurally identical but nominally
  # distinct, so every plugin we pass to `createAuth` fails to typecheck against
  # the other copy's `AuthContext` — a 40-line assignability error that names no
  # property of ours. Pin one.
  # The @lunora/* packages peer on differing @lunora/auth versions, so without
  # this five copies resolve at once — and better-auth plugin types are nominal
  # across copies for the same reason as above. One copy only.
  "@lunora/auth@*": 1.0.0-alpha.201
  "@modelcontextprotocol/sdk@<1.25.2": ">=1.25.2"
  "@opentelemetry/core@<2.8.0": ">=2.8.0"
  "@protobufjs/utf8@<=1.1.0": ">=1.1.1"
  # Every @tiptap/* package must sit on ONE version: their peer ranges pin each
  # other exactly, so a split makes pnpm emit `unmet peer @tiptap/extension-list
  # @3.30.1: found 3.30.4` and leaves two copies of the extension graph.
  # The 30 packages the app declares are pinned through the `tiptap` catalog;
  # these 19 arrive transitively via `reactjs-tiptap-editor`, which asks for
  # `^3.29.2` and so was satisfied by whatever the lockfile already held
  # (3.30.0/3.30.1). 3.30.4 is inside its range — this only forces the
  # re-resolve pnpm had no reason to do on its own.
  "@tiptap/extension-blockquote": 3.31.4
  "@tiptap/extension-bold": 3.31.4
  "@tiptap/extension-bubble-menu": 3.31.4
  "@tiptap/extension-bullet-list": 3.31.4
  "@tiptap/extension-code": 3.31.4
  "@tiptap/extension-code-block": 3.31.4
  "@tiptap/extension-collaboration": 3.31.4
  "@tiptap/extension-collaboration-caret": 3.31.4
  "@tiptap/extension-drag-handle": 3.31.4
  "@tiptap/extension-drag-handle-react": 3.31.4
  "@tiptap/extension-emoji": 3.31.4
  "@tiptap/extension-floating-menu": 3.31.4
  "@tiptap/extension-heading": 3.31.4
  "@tiptap/extension-horizontal-rule": 3.31.4
  "@tiptap/extension-italic": 3.31.4
  "@tiptap/extension-list-item": 3.31.4
  "@tiptap/extension-mention": 3.31.4
  "@tiptap/extension-node-range": 3.31.4
  "@tiptap/extension-ordered-list": 3.31.4
  "@tiptap/extension-strike": 3.31.4
  "@tiptap/suggestion": 3.31.4
  "@tootallnate/once@<3.0.1": ">=3.0.1"
  "@vitest/browser@<4.1.10": ">=4.1.10"
  "@xhmikosr/decompress@<11.1.3": ">=11.1.3"
  # GHSA-6gmq-8vp8-gcm6, and the two 0.8.x entries this replaces. One range, not
  # three: pnpm rewrites the DECLARED spec, so `mammoth`'s `^0.8.6` matched the
  # old `<0.8.13` rule, landed on 0.9.10, and then satisfied `>=0.8.13` forever —
  # a second rule for the 0.9 line never got a look in. An upper bound at the
  # patched version is what actually forces the re-resolve.
  "@xmldom/xmldom@<0.9.12": ">=0.9.12"
  ai@<6.0.35: ">=6.0.35"
  ajv@>=7.0.0-alpha.0 <8.18.0: ">=8.18.0"
  # GHSA-g7r4-m6w7-qqqr. Scoped to `alchemy`, which is the only thing on a
  # vulnerable esbuild (0.27.4). The other copies are deliberately left alone:
  # Copies on 0.25.12 and 0.27.0 sit outside the advisory's `>=0.27.3 <0.28.1`
  # range, and the rest of the tree is already on 0.28.x.
  alchemy>esbuild: ">=0.28.1"
  axios@>=1.0.0 <=1.13.4: ">=1.13.5"
  # ...but NOT for the React Compiler. It declares `@babel/types@^7.26.0`;
  # Babel 8 removed `AssignmentPattern` from the `LVal` alias, and under 8.x the
  # compiler throws `Todo: Expected object property value to be an LVal, got:
  # AssignmentPattern` on ANY component with a destructuring default
  # (`({ size = "default" })`) and silently skips it. This entry covers the
  # compiler's own `t.*` calls only — the check that actually fired is
  # `path.isLVal()`, a NodePath method whose types come from `@babel/traverse`;
  # see the `@babel/traverse@7>@babel/types` entry. Build-time only, outside the
  # lingui context graph above, so its own 7.x copy cannot reintroduce the
  # two-instance crash.
  "babel-plugin-react-compiler>@babel/types": 7.29.8
  basic-ftp@<5.2.0: ">=5.2.0"
  basic-ftp@<=5.2.1: ">=5.2.2"
  basic-ftp@<=5.2.2: ">=5.3.0"
  basic-ftp@<=5.3.0: ">=5.3.1"
  basic-ftp@=5.2.0: ">=5.2.1"
  better-auth@<1.4.2: ">=1.4.10"
  better-auth@<1.6.22: ">=1.6.22"
  # GHSA-qhr7-859c-m2p7, GHSA-6j4f-fj2g-mc7p, GHSA-q2hr-2g5m-vwhr. The 1.x copy
  # stays on 1.x: it is what minimatch@3 (kept CJS on purpose, see below) loads.
  brace-expansion@<1.1.21: "^1.1.21"
  brace-expansion@>=3.0.0 <5.0.12: ">=5.0.12"
  brace-expansion@>=5.0.0 <5.0.6: ">=5.0.6"
  # GHSA-ggr8-5vv4-36mx (stack exhaustion on recursive object graphs). Reached
  # only through `alchemy > drizzle-orm > prisma > @prisma/config`, which is
  # optional-peer machinery this repo never loads — but it is the one unignored
  # finding, so it fails the deploy job's `pnpm audit --audit-level=moderate`
  # before the job reaches anything else. Patched rather than added to
  # `ignoreGhsas`: the fix costs nothing here.
  browserslist@<=4.28.6: ">=4.28.7"
  deepmerge-ts@<8.0.0: ">=8.0.0"
  defu@<=6.1.4: ">=6.1.5"
  diff@>=6.0.0 <8.0.3: ">=8.0.3"
  dompurify@<=3.3.1: ">=3.3.2"
  dompurify@<=3.4.12: ">=3.4.13"
  drizzle-orm@<0.45.2: ">=0.45.2"
  effect@<3.20.0: ">=3.20.0"
  express-rate-limit@>=8.2.0 <8.2.2: ">=8.2.2"
  # GHSA-v422-hmwv-36x6. Only `express` pulls a vulnerable copy.
  express>body-parser: ">=2.3.0"
  # Kept on 3.x. The open-ended `>=3.1.x` targets these replaced moved ajv's
  # `^3.0.1` onto 4.1.3, which then drew four advisories of the 4.x line
  # (GHSA-qw65-cvwx-89v3, GHSA-58mr-gqgx-xq4g, GHSA-hrr3-gc8f-f4qj,
  # GHSA-jvvf-x445-j334); 3.1.8 is outside all of them.
  fast-uri@<3.1.5: "^3.1.5"
  fast-xml-builder@<=1.1.6: ">=1.1.7"
  fast-xml-builder@=1.1.5: ">=1.1.6"
  fast-xml-parser@>=4.0.0-beta.0 <4.5.4: ">=4.5.4"
  fast-xml-parser@>=5.0.0 <5.3.8: ">=5.3.8"
  fflate@>=0.4.5 <0.4.9: ">=0.4.9 <0.5.0"
  fflate@>=0.7.0 <0.7.5: ">=0.7.5 <0.8.0"
  file-type@>=20.0.0 <=21.3.1: ">=21.3.2"
  form-data@>=4.0.0 <4.0.4: ">=4.0.5"
  form-data@>=4.0.0 <4.0.6: ">=4.0.6"
  handlebars@>=4.0.0 <=4.7.9: ">=4.7.10"
  http-cache-semantics@<=4.2.0: ">=4.3.0"
  # One copy, in step with the `server` catalog: `@lunora/*` pins hono exactly, and
  # `@visulima/pail`'s middleware typed against another copy fails `app.use` (TS2769).
  hono: 4.13.13
  immutable: ">=5.1.8"
  immutable@>=4.0.0-rc.1 <4.3.8: ">=4.3.8"
  immutable@>=5.0.0-beta.1 <5.1.8: ">=5.1.8"
  ip-address@<=10.1.0: ">=10.1.1"
  ip-address@<=10.3.0: ">=10.3.1"
  ip-address@<=10.7.0: ">=10.7.1"
  # `jose` is a peer of `@better-auth/core`, so two copies of it split core into
  # two peer-hashed instances — and `BetterAuthPlugin` is nominal across
  # instances, so every plugin passed to `createAuth` stops typechecking. That is
  # exactly what a dependency bump did here: `better-auth`'s core resolved
  # jose 6.2.5 while `@better-auth/api-key`'s resolved 6.2.8. One copy only.
  jose: 6.2.12
  js-cookie@<=3.0.5: ">=3.0.7"
  js-yaml@<3.14.2: ">=4.1.1"
  js-yaml@>=4.0.0 <4.3.2: ">=4.3.2 <5.0.0"
  jsondiffpatch@<0.7.2: ">=0.7.2"
  launch-editor@<2.14.1: ">=2.14.1"
  linkify-it@<5.0.2: ">=5.0.2"
  lodash-es@>=4.0.0 <=4.17.22: ">=4.17.23"
  lodash@>=4.0.0 <=4.17.22: ">=4.17.23"
  mermaid@>=10.9.0-rc.1 <10.9.4: ">=10.9.4"
  mermaid@>=11.0.0-alpha.1 <11.16.1: ">=11.16.1"
  # Keep the bump inside 3.x. An open-ended ">=3.1.4" resolves to the newest
  # minimatch (10.x), which drops the CJS default export — so every consumer
  # declaring `minimatch: ^3.x` (eslint-plugin-jsx-a11y among them) blows up
  # with `(0, _minimatch.default) is not a function` at rule-run time.
  minimatch@<3.1.4: "^3.1.4"
  minimatch@>=10.0.0 <10.2.3: ">=10.2.3"
  minimatch@>=5.0.0 <5.1.8: ">=5.1.8"
  minimatch@>=9.0.0 <9.0.7: ">=9.0.7"
  moment@>=2.29.2 <2.31.0: ">=2.31.0"
  mysql2@<=3.23.0: ">=3.23.1"
  nanoid@<3.3.17: ">=3.3.17"
  nanoid@<3.3.8: ">=3.3.8"
  nanoid@>=4.0.0 <5.0.9: ">=5.0.9"
  nanoid@>=4.0.0 <5.1.16: ">=5.1.16"
  node-forge@<1.3.2: ">=1.3.3"
  path-to-regexp@>=8.0.0 <8.4.0: ">=8.4.0"
  picomatch@<2.3.2: ">=2.3.2"
  picomatch@>=4.0.0 <4.0.4: ">=4.0.4"
  piscina@<4.9.3: ">=4.9.3"
  piscina@>=5.0.0 <5.3.2: ">=5.3.2"
  playwright@<1.55.1: ">=1.57.0"
  # GHSA-rj75-hqrm-r3gf has no 6.x fix, and `@tailwindcss/typography` exact-pins
  # 6.0.10; its `parse`/`walk` use is the same on 7.x.
  postcss-selector-parser@<7.1.6: 7.1.6
  postcss@<8.5.10: ">=8.5.10"
  postcss@<=8.5.22: ">=8.5.23"
  preact@>=10.28.0 <10.28.2: ">=10.28.2"
  protobufjs@<7.5.5: ">=7.5.5"
  protobufjs@<8.6.6: ">=8.6.6"
  protobufjs@<=7.5.5: ">=7.5.6"
  protobufjs@<=7.5.7: ">=7.5.8"
  qs@>=2.2.5 <6.16.0: ">=6.16.0"
  # GHSA-vcc3-ghjq-m6fr. Only `query-string` pulls a vulnerable copy.
  query-string>decode-uri-component: ">=0.5.0"
  react-router@>=7.0.0 <7.12.0: ">=7.12.0"
  rollup@<2.80.0: ">=2.80.0"
  rollup@>=4.0.0 <4.59.0: ">=4.59.0"
  semver@>=7.0.0 <7.5.2: ">=7.7.3"
  serialize-javascript@<=7.0.2: ">=7.0.3"
  serialize-javascript@>=5.0.0 <7.0.5: ">=7.0.5"
  seroval@<1.4.1: ">=1.4.1"
  sharp@<0.35.5: ">=0.35.5"
  shell-quote@<=1.8.4: ">=1.9.0"
  shell-quote@>=1.1.0 <=1.8.3: ">=1.8.4"
  shiki: 4.5.0
  smol-toml@<=1.8.0: ">=1.9.0 <2.0.0"
  svelte@<=5.55.6: 5.55.10
  svgo@>=4.0.0 <4.0.2: ">=4.0.2"

    "@ai-sdk/anthropic": 4.0.79
    # Depends on exactly one @ai-sdk/openai, provider and provider-utils release —
    # move it with those, or pnpm splits them. (`@lunora/agent` pins `ai` 7.0.127
    # exactly, so codegen/testing carry that older copy; nothing of ours imports it.)

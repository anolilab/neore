packages:
  - "apps/*"
  - "backend"
  - "packages/*"
  - "tools/*"
  - "services/*"

auditConfig:
  # Only advisories with NO published fix belong here. Everything else is
  # patched through `overrides` above, because an ignore entry outlives the
  # reason for it: nine of the eleven that used to sit here were Next.js, and
  # eight of those did not even apply to the installed 16.x — they were written
  # against `< 15.5.21`. The ninth was live and suppressed.
  ignoreGhsas:
    # image-size <=2.0.2, via `pptxgenjs`. No patched release exists.
    - GHSA-w3rx-r6r6-pgpr
    - GHSA-5p2g-fcmc-qvqq
    # @ai-sdk/provider-utils <=3.0.97. No patched release exists; the 5.x copies
    # in the tree are unaffected, the older ones come in transitively.
    - GHSA-866g-f22w-33x8
    # braces <=3.0.3, via micromatch/fast-glob (28 paths). No patched release exists.
    - GHSA-vfj7-8cjw-p6xm
    # sprintf-js <=1.1.3, via argparse 1 under `mammoth`. No patched release exists.
    - GHSA-hp3w-g68c-fv3c

# OFF: auto-installing peers materialised Next.js — which nothing here uses — as
# the peer of fumadocs, geist, better-auth, @visulima/pail and friends, and its
# advisories then failed `pnpm audit`. Required peers are declared by the
# workspace package that needs them instead.
autoInstallPeers: false

blockExoticSubdeps: true
catalog:
  "@lunora/client": 1.0.0-alpha.193
  "@lunora/react": 1.0.0-alpha.206
  "@lunora/workflow": 1.0.0-alpha.72
  "@visulima/yaml": 1.0.0
catalogMode: prefer


  build:
    # Moves WITH wrangler: each vite-plugin release peer-requires the wrangler
    # of its day (1.62.3 wants ^4.145.0) and `vite dev` refuses to start on a
    # mismatch. Wrangler >= 4.129.1 logs "Error inside ProxyWorker" (miniflare's
    # "Network connection lost.") as one failed request instead of exiting the
    # dev server — the crash the old 4.124.0 pin lived with. The bump ships a new
    # workerd binary; a per-app firewall (OpenSnitch) must allow it once.
    "@cloudflare/vite-plugin": 1.67.0
    # wrangler peer-requires ^5.<its workerd date> — 4.145.0 wants ^5.20260930.2.
    # Bump with wrangler.
    "@cloudflare/workers-types": 5.20261106.1
    "@crxjs/vite-plugin": 3.0.0
    "@prosopo/vite-plugin-watch-workspace": 2.6.33
    # `@vitejs/plugin-react` and `@lingui/vite-plugin` peer on it; 0.3 is accepted
    # from plugin-react 6.2.0 and lingui 6.12.0 on, so move them together.
    "@rolldown/plugin-babel": 0.3.0
    "@tailwindcss/vite": 4.3.5
    # 1.0.2 and 1.0.3 bundle harfbuzzjs without shipping its `hb.wasm`, and its
    # CommonJS loader cannot run in their ESM node build (`Dynamic require of
    # "fs"`, then `__dirname`, then ENOENT hb.wasm) — `scripts/generate-og.mjs`,
    # and so `apps/web`'s `pnpm run build`, fails. 1.0.1 has no harfbuzz.
    # HELD AT 1.0.1 — 1.0.2 and 1.0.3 ship `dist/index.node.js` with a bundled
    # `require("fs")` that Node's ESM loader rejects ("Dynamic require of "fs" is not
    # supported"), so `apps/web/scripts/generate-og.mjs` and with it `pnpm build` fail.
    # Re-check on each release by running `node apps/web/scripts/generate-og.mjs`.
    "@vercel/og": 1.0.1
    "@visulima/dev-toolbar": 1.1.19
    "@visulima/vite-overlay": 2.0.41
    "@vite-pwa/assets-generator": ^2.0.0
    "@vitejs/plugin-react": 6.2.1
    esbuild: 0.28.2
    sharp: 0.35.5
    svgo: 4.1.0
    unplugin-fonts: 2.1.0
    unplugin-purge-polyfills: 0.1.0
    vite: 8.3.6
    vite-plugin-image-optimizer: 2.0.3
    vite-plugin-svgr: 5.2.0
    vite-plugin-wasm: 3.6.0
    vite-plugin-zip-pack: ^1.2.4
    workbox-build: 7.4.1
    workbox-window: 7.4.1
    wrangler: 4.158.0
  bundler:
    "@swc-node/register": ~1.12.1
    "@swc/cli": 0.8.2
    "@swc/core": 1.16.22
    "@swc/helpers": 0.5.24
    "@visulima/packem": 4.0.5
    # Required (non-optional) peer of packem, pinned exactly by it — move with
    # packem. Declared since `autoInstallPeers: false`; without it every
    # `packem build` dies with "Cannot find package '@visulima/packem-rollup'".
    "@visulima/packem-rollup": 1.2.4
    # Optional peer of packem and its rollup plugins, declared by the three
    # packem users. Undeclared, pnpm 12.8.1 resolved it from wherever a rollup
    # happened to sit in the tree and `pnpm dedupe` flipped between "with" and
    # "without" on every run, so `pnpm dedupe --check` (part of `pnpm lint`)
    # could never pass. EXACT: packem 4's `@visulima/packem-share` pins rollup
    # exactly (4.67.4 for packem 4.0.5) — move with packem.

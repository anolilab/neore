minimumReleaseAge: 1440

# First-party Visulima packages are exempted from the 24h maturation window so the
# toolchain (vis, packem, dev-toolbar, …) can be tracked at latest. The window
# still applies to every other dependency. Remove an entry here if a package
# stops being first-party.
#
# Lunora (anolilab/lunora) is exempted on the same first-party grounds: it is the
# backend framework and its alpha channel publishes several times a day, so the
# 24h window would pin us to a version that no longer exists by the time it
# matures. Revisit once Lunora reaches a stable `latest` channel — at that point
# the window becomes cheap again and these entries should be removed.
minimumReleaseAgeExclude:
  - "@visulima/*"
  - "@lunora/*"
  - "lunorash"
  # better-auth 1.7.16 (what @lunora/auth 1.0.0-alpha.257 pins), published 2026-11-03 ~21:24 UTC,
  # better-call 1.4.5 at 20:45 UTC; drop these after 2026-11-04 21:30 UTC.
  - "better-auth@1.7.16"
  - "@better-auth/api-key@1.7.16"
  - "@better-auth/cimd@1.7.16"
  - "@better-auth/core@1.7.16"
  - "@better-auth/drizzle-adapter@1.7.16"
  - "@better-auth/kysely-adapter@1.7.16"
  - "@better-auth/mcp@1.7.16"
  - "@better-auth/memory-adapter@1.7.16"
  - "@better-auth/mongo-adapter@1.7.16"
  - "@better-auth/oauth-provider@1.7.16"
  - "@better-auth/passkey@1.7.16"
  - "@better-auth/prisma-adapter@1.7.16"
  - "@better-auth/scim@1.7.16"
  - "@better-auth/telemetry@1.7.16"
  - "better-call@1.4.5"
  # tsrs 0.23.0-ts7.1.0-beta, published 2026-11-07 04:09 UTC; drop after 2026-11-08 04:10 UTC.
  - "tsrs@0.23.0-ts7.1.0-beta"
  - "@tsrs/win32-x64@0.23.0-ts7.1.0-beta"
  - "@tsrs/darwin-x64@0.23.0-ts7.1.0-beta"
  - "@tsrs/darwin-arm64@0.23.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-gnu@0.23.0-ts7.1.0-beta"
  - "@tsrs/linux-x64-musl@0.23.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-gnu@0.23.0-ts7.1.0-beta"
  - "@tsrs/linux-arm64-musl@0.23.0-ts7.1.0-beta"

# pnpm 11 replaced onlyBuiltDependencies with this map (true = may run its
# build scripts). `strictDepBuilds` is on by default since 11, so a NEW
# dependency with an install script fails `pnpm install` until it is listed
# here as true or false. Keep the values booleans: pnpm 12.8.1 parses a version
# string here without complaint and then treats it as NOT approved, so a bulk
# version edit that rewrites `sharp: true` to `sharp: 0.35.5` fails the next
# install with ERR_PNPM_IGNORED_BUILDS.
allowBuilds:
  "@modelcontextprotocol/ext-apps": true
  electron: true
  "@parcel/watcher": true
  "@prisma/engines": true
  "@swc/core": true
  "@tailwindcss/oxide": true
  canvas: true
  classic-level: true
  core-js: true
  cpu-features: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  msgpackr-extract: true
  msw: true
  node-pty: true
  oxc-resolver: true
  prisma: true
  protobufjs: true
  rs-module-lexer: true
  sharp: true
  sqlite3: true
  ssh2: true
  unrs-resolver: true
  vue-demi: true
  workerd: true

overrides:
  # GHSA-4x5r-pxfx-6jf8. Kept inside 7.x deliberately: 8.0.1 is also in the tree
  # and the react-compiler plugin is pinned to 7.x on purpose (see the
  # `@babel/types` note above), so an unconditional `>=7.29.6` would resolve to
  # 8.x and split that arrangement.
  "@babel/core@<7.29.6": 7.29.7
  "@babel/plugin-transform-modules-systemjs@>=7.12.0 <=7.29.3": ">=7.29.4"
  # node-forge <=1.4.0 (PEM ReDoS, PKCS#12 MAC forgery, TLS DoS, basicConstraints
  # bypass, AES-GCM tag length, among others), all fixed in 1.4.1. Reached only
  # through apps/mobile's Expo CLI chain (@expo/code-signing-certificates).
  "node-forge@<=1.4.0": 1.4.1
  # Babel 7's traverse gets the Babel 7 types it was built for. The React
  # Compiler checks patterns with `path.isLVal()`, which @babel/traverse answers
  # from ITS @babel/types; under the global 8.0.4 override that dropped
  # `AssignmentPattern` from `LVal`, so every function with a destructuring
  # default bailed out of the compiler — measured 2026-09-25 at 454 of 1688 in
  # apps/web + packages/ui + packages/chat-ui (MessageItem, MessageList, …).
  # Scoped to traverse@7: lingui's `@babel/types` peer is untouched, so the
  # single-lingui-instance guarantee below still holds. Check a component in the
  # served dev module: compiled code starts with `const $ = _c(n)`.
  "@babel/traverse@7>@babel/types": 7.29.8
  # Pin ONE copy, and keep it in step with the `better-auth` catalog entry —
  # each release depends on the same core version, so leaving this at an older version splits core
  # into two peer-hashed instances and `BetterAuthPlugin` stops being assignable
  # (nine errors in `lunora/auth.ts` naming none of our own properties).
  # `@babel/types` is a peer of `@lingui/react`, and two copies of it split
  # lingui into two peer-hashed instances — which means TWO React contexts.
  # `apps/web` mounts `I18nProvider` on one and `packages/ui` calls `useLingui()`
  # against the other, so the hook returns null and any UI component using it
  # crashes with "Cannot destructure property ... as it is null". The data grid
  # was the visible casualty. One copy only.
  "@babel/types": 8.0.6
  "@better-auth/core": 1.7.16
  "@eslint/plugin-kit@<0.3.3": ">=0.5.0"
  "@grpc/grpc-js@<1.14.5": ">=1.14.5"

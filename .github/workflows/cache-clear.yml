name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions: {}

jobs:
    cleanup-branch-cache:
        permissions:
            actions: "write" # to delete the closed branch's caches
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            target-repo: "anolilab/neore"

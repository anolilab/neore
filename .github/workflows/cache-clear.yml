name: "Cleanup caches by a branch"

on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "closed"

permissions: {}

jobs:
    cleanup-branch-cache:
        permissions:
            actions: "write" # to delete the closed branch's caches
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/cleanup-branch-cache.yaml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            target-repo: "anolilab/neore"

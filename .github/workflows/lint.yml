name: "Lint"
on:
    pull_request:
        branches: ["main"]
    # The merge queue re-runs the gate on the exact commit that lands on main.
    merge_group: # yamllint disable-line rule:empty-values
permissions: {}

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
    lint:
        permissions:
            contents: "read"
            pull-requests: "read"
        uses: "anolilab/workflows/.github/workflows/lint.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            # ESLint runs in its own job below: the shared job builds the whole
            # workspace first, which needs the Rust toolchain it lacks.
            lint_eslint: false
            # The type check runs in its own job below: `lint:types` builds the
            # document-parser Worker, which needs the Rust toolchain this shared
            # job does not install.
            lint_types: false
            # attw has no task in this repository (`vis run lint:attw` matches no
            # project), so the shared step has nothing real to check.
            lint_attw: false
            # The shared package.json step runs after a workspace build, which needs
            # the Rust toolchain it lacks. The order check runs in the types job.
            lint_package_json: false
            lint_markdown: false
            lint_yaml: true
            # Actionlint runs in its own job below. The shared step installs its
            # helper with `npm install` in the repo root, which cannot read pnpm's
            # `catalog:` specifiers and fails before linting (EUNSUPPORTEDPROTOCOL).
            lint_actionlint: false
            lint_rust: false
            node_version: "24.22.1"

    # The shared workflow above accepts exactly eight `lint_*` inputs and none of
    # them is oxfmt or secret scanning — checked against its own definition,
    # not assumed. Both are enforced locally (`pnpm lint:oxfmt`, `pnpm vis
    # secrets`, and the pre-commit hook), so before this job a PR could go green
    # having never had either run in CI.
    # `dorny/paths-filter` reads the PR's file list through the REST API, so the
    # job needs `pull-requests: read` (see test.yml).
    files-changed:
        name: "Detect what files changed"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 3
        permissions:
            contents: "read"
            pull-requests: "read"
        outputs:
            code: "${{ steps.changes.outputs.code }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"
            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false
            - name: "Check for file changes"
              uses: "dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d" # v4.0.3
              id: "changes"
              with:
                  token: "${{ github.token }}"
                  filters: ".github/file-filters.yml"
    format-and-secrets:
        name: "oxfmt and secret scan"
        runs-on: "ubuntu-latest"
        timeout-minutes: 20
        permissions:
            contents: "read"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  # `vis secrets` diffs against a baseline that pins findings to
                  # line numbers; a shallow clone is enough for the scan itself,
                  # but full history keeps the diff output meaningful.
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  enable-nx-cache: "false" # no Nx in this repo: the cache never hits
                  node-version: "24.22.1"
                  npm-version: "11"
                  skip-playwright: "true"

            - name: "Check formatting"
              shell: "bash"
              run: "pnpm lint:oxfmt"

            - name: "Scan for secrets"
              shell: "bash"
              run: "pnpm vis secrets"

            # `alchemy.run.ts` runs under `tsx`, which strips types unchecked, and
            # belongs to no workspace project, so neither `vis run lint:types` nor
            # any project's eslint reaches it. Needs no build: everything it
            # imports is committed source or a published package.
            - name: "Check the deploy script"
              shell: "bash"
              run: "pnpm run lint:types:deploy && pnpm run lint:eslint:deploy"

    # oxlint enforces only what ESLint enforces (`.oxlintrc.json` is generated from
    # ESLint's config by `pnpm lint:oxlint:sync`), so it gates like ESLint does.
    oxlint:
        name: "oxlint"
        needs: "files-changed"
        if: "github.event_name == 'merge_group' || needs.files-changed.outputs.code == 'true'"
        runs-on: "ubuntu-latest"
        timeout-minutes: 30
        permissions:
            contents: "read"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  enable-nx-cache: "false" # no Nx in this repo: the cache never hits
                  node-version: "24.22.1"
                  npm-version: "11"
                  skip-playwright: "true"

            # A rule ESLint turned off for some files but the committed config still
            # enforces would fail here on code ESLint accepts.
            - name: "Check that .oxlintrc.json matches ESLint's config"
              shell: "bash"
              run: "pnpm run lint:oxlint:sync && git diff --exit-code .oxlintrc.json"

            - name: "oxlint"
              shell: "bash"
              run: "pnpm run lint:oxlint"

    types:
        name: "Types"
        needs: "files-changed"
        # Skipped (reported as success) when the change touches no code, e.g. docs only.
        if: "github.event_name == 'merge_group' || needs.files-changed.outputs.code == 'true'"
        runs-on: "ubuntu-latest"
        timeout-minutes: 45
        permissions:
            contents: "read"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  enable-nx-cache: "false" # no Nx in this repo: the cache never hits
                  node-version: "24.22.1"
                  npm-version: "11"
                  skip-playwright: "true"

            # `lint:types` builds the document-parser Worker (worker-build), so the
            # same toolchain the test workflow installs is needed here too.
            - name: "Setup Rust Worker toolchain"
              uses: "./.github/actions/setup-rust-worker"

            # `lint:types` builds packages/device-core-node, whose Linux keyring backend links libdbus at build time.
            - name: "Install libdbus for the Linux keyring"
              shell: "bash"
              run: "bash .github/scripts/apt-retry.sh sudo apt-get install -y libdbus-1-dev pkg-config"

            - name: "Type check"
              shell: "bash"
              run: "pnpm lint:types"

            - name: "Package.json order"
              shell: "bash"
              run: "pnpm exec sort-package-json --check packages/*/package.json apps/*/package.json backend/package.json services/*/package.json package.json"

    eslint:
        name: "ESLint"
        needs: "files-changed"
        # Skipped (reported as success) when the change touches no code, e.g. docs only.
        if: "github.event_name == 'merge_group' || needs.files-changed.outputs.code == 'true'"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 45
        permissions:
            contents: "read"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  node-version: "24.22.1"
                  npm-version: "11"
                  skip-playwright: "true"

            # Typed rules read the packages' emitted declarations. `build:packages` builds the
            # `type:package` projects (`ai`, `service-sdk`), which need neither the Rust toolchain
            # nor libdbus: those stay with the type check, which builds the native module.
            - name: "Build packages"
              shell: "bash"
              run: "pnpm run build:packages"

            - name: "ESLint"
              shell: "bash"
              run: "pnpm lint:eslint"

    actionlint:
        name: "Actionlint"
        runs-on: "ubuntu-latest"
        timeout-minutes: 10
        permissions:
            contents: "read"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            # Pinned image; the default entrypoint lints every workflow under
            # .github/workflows of the mounted checkout.
            - name: "Lint workflows"
              shell: "bash"
              run: 'docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12'

    # One stable name for the ruleset to require, so adding or splitting a job
    # above never needs a ruleset change. `always()`: a job skipped by its own
    # `if:` reports success, so the gate must run when a need fails.
    lint-required-check:
        name: "Check Lint"
        needs: ["lint", "files-changed", "format-and-secrets", "oxlint", "types", "eslint", "actionlint"]
        if: "always()"
        runs-on: "ubuntu-latest"
        timeout-minutes: 5
        steps:
            - name: "Fail if a dependency failed or was cancelled"
              if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
              run: |
                  echo "A lint job failed or was cancelled." && exit 1

name: "Lock inactive issues and pull requests"

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 * * * *"

permissions: {}

jobs:
    lock-closed:
        permissions:
            discussions: "write"
            issues: "write"
            pull-requests: "write"
        uses: "anolilab/workflows/.github/workflows/lock-closed.yml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            target-repo: "anolilab/neore"

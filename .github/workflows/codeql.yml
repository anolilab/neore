name: "CodeQL"
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
    # A pull request runs the Rust analysis only when it changes Rust; push to main and the
    # weekly run always do.
    changes:
        name: "Rust changed"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 5
        permissions:
            contents: "read"
        outputs:
            rust: "${{ steps.rust.outputs.changed }}"
        steps:
            - name: "Git checkout"
              if: "github.event_name == 'pull_request'"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Look for Rust changes"
              id: "rust"
              shell: "bash"
              env:
                  BASE_SHA: "${{ github.event.pull_request.base.sha }}"
                  EVENT: "${{ github.event_name }}"
              run: |
                  if [ "${EVENT}" != "pull_request" ]; then
                      echo "changed=true" >> "${GITHUB_OUTPUT}"
                      exit 0
                  fi

                  # Captured first, so a failing diff fails this job instead of reading as "no Rust"
                  # (and no early-exiting `grep -q` can break the pipe under pipefail).
                  files="$(git diff --name-only "${BASE_SHA}...HEAD")"

                  if grep -E '(\.rs$|(^|/)Cargo\.(toml|lock)$)' <<< "${files}" > /dev/null; then
                      echo "changed=true" >> "${GITHUB_OUTPUT}"
                  else
                      echo "changed=false" >> "${GITHUB_OUTPUT}"
                  fi

    codeql:
        needs: ["changes"]
        # Runs even when the change check did not finish; Rust is then analysed too (below).
        if: "${{ !cancelled() }}"
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            # `actions` analyses the workflow files themselves (script injection,
            # untrusted checkouts) alongside the application code; `rust` covers
            # services/document-parser.
            #
            # `rust` takes ~9 minutes: a pull request that changes no Rust skips it. An unknown
            # answer (the check did not finish) analyses Rust as well.
            languages: '${{ needs.changes.outputs.rust == ''false'' && ''["javascript-typescript", "actions"]'' || ''["javascript-typescript", "actions", "rust"]'' }}'
            branches: '["main"]'

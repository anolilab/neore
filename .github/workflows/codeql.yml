name: "CodeQL"
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
    schedule:
        - cron: "0 0 * * 1"
permissions: {}

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
    codeql:
        permissions:
            security-events: "write"
            actions: "read"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/codeql.yml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            # `actions` analyses the workflow files themselves (script injection,
            # untrusted checkouts) alongside the application code; `rust` covers
            # services/document-parser.
            languages: '["javascript-typescript", "actions", "rust"]'
            branches: '["main"]'

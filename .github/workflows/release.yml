# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Release"

# Every push to main either opens or updates the release PR (version-PR mode, see
# `release.channels` in vis.config.ts), or, when that push is the merged release PR,
# publishes it: tags `v<version>` and creates the GitHub release. `deploy.yml`
# deploys on that `v*` tag.
on: # yamllint disable-line rule:truthy
    push:
        branches:
            - "main"
    workflow_dispatch: # yamllint disable-line rule:empty-values

permissions:
    contents: "read" # for checkout

concurrency:
    group: "release-${{ github.ref }}"
    cancel-in-progress: false

jobs:
    release:
        name: "Release"
        if: "github.repository == 'anolilab/neore'"
        runs-on: "ubuntu-latest"
        permissions:
            contents: "write" # to push the release tag and the release PR branch
            issues: "write" # to comment on released issues
            pull-requests: "write" # to open and update the release PR

        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  fetch-depth: 0
                  # vis pushes tags and the release PR branch with this token. GITHUB_TOKEN
                  # cannot trigger other workflows, so a tag it pushed would never start deploy.yml.
                  token: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
                  persist-credentials: false

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@b5d611c5dda8645e93f2407e3d3fee250a9f5376" # main
              with:
                  node-version: "22.x"
                  cache-prefix: "release"

            # services/document-parser is a Rust Worker: `test` builds it (`build:worker`),
            # so the affected run needs rustc + wasm32 + worker-build.
            - name: "Setup Rust Worker toolchain"
              uses: "./.github/actions/setup-rust-worker"

            - name: "Build the document-parser Worker"
              shell: "bash"
              run: "pnpm --filter document-parser run build:worker"

            - name: "Build Production"
              run: "pnpm run build:packages:prod"

            - name: "Test (affected)"
              run: 'pnpm exec vis affected test --base "$VIS_BASE" --head "$VIS_HEAD" --fail-fast'
              env:
                  # Same refs as test.yml: only projects touched by this push are tested.
                  # A manual run has no push range, and a push that creates the branch sends an
                  # all-zero `before`. Both test against the previous commit.
                  VIS_BASE: "${{ github.event.before != '0000000000000000000000000000000000000000' && github.event.before || 'HEAD~1' }}"
                  VIS_HEAD: "${{ github.sha }}"
                  # This is needed for the colorize integration test
                  TEST_PROD_BUILD: "true"

            # Setup and the builds write files into the checkout (the composite appends to
            # `.npmrc`, postinstall regenerates `worker-configuration.d.ts`). `vis release`
            # refuses to run on a dirty tree. Ignored paths (node_modules, dist) stay.
            - name: "Reset the working tree"
              shell: "bash"
              run: |
                  git status --porcelain
                  git checkout -- .
                  git clean -fd

            - name: "Release"
              shell: "bash"
              env:
                  GH_TOKEN: "${{ github.token }}"
                  VIS_GH_TOKEN: "${{ secrets.SEMANTIC_RELEASE_GITHUB_TOKEN }}"
                  PUSH_HEAD: "${{ github.sha }}"
                  GIT_AUTHOR_NAME: "github-actions-shell"
                  GIT_AUTHOR_EMAIL: "github-actions[bot]@users.noreply.github.com"
                  GIT_COMMITTER_NAME: "github-actions-shell"
                  GIT_COMMITTER_EMAIL: "github-actions[bot]@users.noreply.github.com"
              run: |
                  # The release PR's branch is the only source of a merged release. Its change
                  # files are generated on the runner and applied to that branch, so main never
                  # holds them, and a diff under .vis/release cannot tell the merge apart. Any
                  # push that is not that merge derives change files from its commits. Without
                  # this check, the merge push would regenerate the same bumps and open another
                  # release PR, and nothing would ever publish.
                  if ! heads="$(gh api "repos/$GITHUB_REPOSITORY/commits/$PUSH_HEAD/pulls" --jq '.[].head.ref')"; then
                      echo "Could not list the pull requests for $PUSH_HEAD; refusing to guess" >&2
                      exit 1
                  fi

                  if printf '%s\n' "$heads" | grep -qx 'vis-release/version-packages'; then
                      pnpm exec vis release ci release
                  else
                      pnpm exec vis release ci release --generate --allow-full-history
                  fi

# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Preview"

# Every open pull request gets its own copy of the whole stack (stage `pr-<number>`) in the
# preview Cloudflare account, redeployed on every push and destroyed when the pull request
# closes. Each preview is a set of billed resources, so this is a deliberate cost decision.
#
# Same-repository pull requests only: the deploy job holds the preview environment's
# Cloudflare token and runs the pull request's code, which a fork must never do.
on: # yamllint disable-line rule:truthy
    pull_request:
        types:
            - "labeled"
            - "unlabeled"
            - "synchronize"
            - "reopened"
            - "closed"

# One run per pull request. The deploy workflow serialises its own state under
# `deploy-pr-<number>`; this group must NOT be that one, or caller and callee wait
# on each other forever.
concurrency:
    group: "preview-${{ github.event.pull_request.number }}"
    cancel-in-progress: false

permissions: {}

env:
    STAGE: "pr-${{ github.event.pull_request.number }}"

jobs:
    # Only a pull request that changes a component or Storybook gets a preview: the
    # components and the stories are what a preview is for, and a preview is billed.
    changes:
        name: "Did the pull request change a component or Storybook?"
        if: >-
            github.repository == 'anolilab/neore'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.action != 'closed'
        runs-on: "ubuntu-24.04"
        timeout-minutes: 5
        permissions:
            contents: "read"
        outputs:
            components: ${{ steps.filter.outputs.components }}
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - id: "filter"
              name: "Match the changed files"
              shell: "bash"
              env:
                  BASE: "${{ github.event.pull_request.base.sha }}"
                  HEAD: "${{ github.event.pull_request.head.sha }}"
              run: |
                  changed="$(git diff --name-only "$BASE" "$HEAD")"
                  if printf '%s\n' "$changed" | grep -Eq '^(packages/ui/src/components/|packages/chat-ui/src/|apps/web/src/components/|apps/web/src/storybook/|apps/web/\.storybook/)|\.stories\.tsx?$'; then
                      echo "components=true" >> "$GITHUB_OUTPUT"
                  else
                      echo "components=false" >> "$GITHUB_OUTPUT"
                  fi

    # Only Storybook is previewed: `alchemy-storybook.run.ts` declares the Storybook site alone, so the
    # preview needs the Cloudflare token and account, not the app's secrets or its paid resources.
    # The build runs first, with no secrets; the deploy step is the only one that sees the token.
    storybook:
        name: "Deploy the Storybook preview"
        needs: "changes"
        if: >-
            github.repository == 'anolilab/neore'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.action != 'closed'
            && needs.changes.outputs.components == 'true'
        runs-on: "ubuntu-24.04"
        timeout-minutes: 30
        environment: "preview"
        permissions:
            contents: "read"
            deployments: "write"
        outputs:
            storybook-url: "${{ steps.alchemy.outputs.storybook-url }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false
                  ref: "${{ github.event.pull_request.head.sha }}"

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  enable-nx-cache: "false" # no Nx in this repo: the cache never hits
                  node-version: "24.22.1"
                  npm-version: "11"
                  skip-playwright: "true"

            - name: "Build the workspace packages"
              shell: "bash"
              run: "pnpm run build:packages"

            - name: "Build Storybook"
              shell: "bash"
              run: "pnpm --filter @neore/web run build-storybook"

            # The only step with the token: it uploads the built output and runs nothing else from the repo.
            - name: "Deploy Storybook via Alchemy"
              id: "alchemy"
              shell: "bash"
              env:
                  CI: "true"
                  CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
                  CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
                  CLOUDFLARE_WORKERS_SUBDOMAIN: "${{ vars.WORKERS_DEV_SUBDOMAIN }}"
                  DEPLOY_ENV: "${{ env.STAGE }}"
              run: |
                  output="$(pnpm exec alchemy deploy alchemy-storybook.run.ts --stage "$DEPLOY_ENV" --yes --log-level info 2>&1)" || { echo "$output"; exit 1; }
                  echo "$output"
                  url="$(echo "$output" | grep -oE 'https://[^ '\''"}]*workers\.dev[^ '\''"}]*' | head -1 || true)"
                  echo "storybook-url=${url}" >> "$GITHUB_OUTPUT"

    comment:
        name: "Comment the preview URL"
        needs: "storybook"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 5
        permissions:
            pull-requests: "write"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Post or update the comment"
              uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
              env:
                  STORYBOOK_URL: "${{ needs.storybook.outputs.storybook-url }}"
                  RUN_URL: "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
              with:
                  script: |
                      const marker = "<!-- neore-preview -->";
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;
                      const sha = context.payload.pull_request.head.sha.slice(0, 7);

                      const body = [
                          marker,
                          `**Storybook preview** for \`${sha}\`: ${process.env.STORYBOOK_URL || "deployed (the run did not report a URL)"} (every component and page on fake data)`,
                          "",
                          "Only Storybook is previewed here; the app is not deployed to previews.",
                          "",
                          `[Deploy run](${process.env.RUN_URL}). It is destroyed when this pull request closes.`,
                      ].join("\n");

                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                      const existing = comments.find((comment) => comment.body?.startsWith(marker));

                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body });
                      } else {
                          await github.rest.issues.createComment({ owner, repo, issue_number, body });
                      }

    destroy:
        name: "Destroy the preview"
        if: >-
            github.repository == 'anolilab/neore'
            && github.event.pull_request.head.repo.full_name == github.repository
            && github.event.action == 'closed'
        runs-on: "ubuntu-24.04"
        timeout-minutes: 30
        environment: "preview"
        permissions:
            contents: "read"
            pull-requests: "write"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            # The code that deployed it: the stack's providers and resource list come from
            # `alchemy.run.ts`, and the merge ref of a merged pull request is gone.
            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false
                  ref: "${{ github.event.pull_request.head.sha }}"

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  enable-nx-cache: "false" # no Nx in this repo: the cache never hits
                  node-version: "24.22.1"
                  skip-playwright: "true"

            - name: "Destroy the Storybook preview"
              env:
                  CI: "true"
                  CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
                  CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
                  CLOUDFLARE_WORKERS_SUBDOMAIN: "${{ vars.WORKERS_DEV_SUBDOMAIN }}"
                  DEPLOY_ENV: "${{ env.STAGE }}"
              run: 'pnpm exec alchemy destroy alchemy-storybook.run.ts --stage "$DEPLOY_ENV" --yes'

            - name: "Destroy the stage (full stack, for earlier previews)"
              continue-on-error: true
              env:
                  CI: "true"
                  CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
                  CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
                  CLOUDFLARE_WORKERS_SUBDOMAIN: "${{ vars.WORKERS_DEV_SUBDOMAIN }}"
                  DEPLOY_ENV: "${{ env.STAGE }}"
                  # alchemy.run.ts skips its deploy guards and builds nothing.
                  DESTROY: "true"
              run: 'pnpm exec alchemy destroy --stage "$DEPLOY_ENV" --yes'

            - name: "Update the comment"
              uses: "actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3" # v9.0.0
              with:
                  script: |
                      const marker = "<!-- neore-preview -->";
                      const { owner, repo } = context.repo;
                      const issue_number = context.payload.pull_request.number;

                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number, per_page: 100 });
                      const existing = comments.find((comment) => comment.body?.startsWith(marker));

                      if (existing) {
                          await github.rest.issues.updateComment({ owner, repo, comment_id: existing.id, body: `${marker}\nThe preview was destroyed.` });
                      }

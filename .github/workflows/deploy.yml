# https://alchemy.run/getting-started/

name: "Deploy"

on: # yamllint disable-line rule:truthy
    push:
        tags:
            - "v*" # e.g. v1.0.0, v2.3.1-rc.1
    workflow_dispatch:
        inputs:
            environment:
                description: "Target environment: the GitHub environment and Cloudflare account (production only runs from a v* tag: pick the tag under \"Use workflow from\")"
                required: true
                default: "production"
                type: "choice"
                options:
                    - "production"
                    - "staging"
                    - "preview"
            stage:
                description: "Alchemy stage (names, state): defaults to the environment. A pull request preview uses pr-<number> on the preview environment"
                required: false
                default: ""
                type: "string"
            adopt:
                description: "Take over existing resources of the same names (first deploy over a manually created or older setup only)"
                required: false
                default: false
                type: "boolean"
            log_level:
                description: "alchemy --log-level (use debug to see the failing API call)"
                required: false
                default: "info"
                type: "choice"
                options:
                    - "info"
                    - "debug"
            dry_run:
                description: "Only show the plan: create and change nothing (the state store is still created on its first run)"
                required: false
                default: false
                type: "boolean"
    workflow_call:
        inputs:
            environment:
                required: true
                type: "string"
            stage:
                required: false
                default: ""
                type: "string"
            adopt:
                required: false
                default: false
                type: "boolean"
            log_level:
                required: false
                default: "info"
                type: "string"
            dry_run:
                required: false
                default: false
                type: "boolean"
        outputs:
            website-url:
                description: "The deployed web app's URL"
                value: "${{ jobs.deploy-cloudflare.outputs.website-url }}"

# Keyed on the stage, not the ref: two tags (or a tag and a manual run) would
# otherwise run two Alchemy deploys against the same state at once, while two pull
# request previews can deploy side by side. A caller must NOT use this group itself:
# a caller and its callee holding one group deadlock.
concurrency:
    group: "deploy-${{ inputs.stage || inputs.environment || 'production' }}"
    # Don't cancel in-progress deployments to avoid partial deploys
    cancel-in-progress: false

permissions:
    contents: "read"

jobs:
    # -----------------------------------------------------------------
    # Step 1: Resolve the target environment for the job below. Nothing is
    # built here: the deploy job builds what it ships (see the note there).
    # -----------------------------------------------------------------
    resolve-env:
        name: "Resolve environment"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 5
        outputs:
            # The GitHub environment, which decides the Cloudflare account and the secrets.
            # 'production' for a v* tag push; the chosen one for a dispatch or a call.
            deploy-env: "${{ steps.env.outputs.deploy-env }}"
            # The Alchemy stage: the environment unless one was given (pr-<number>).
            stage: "${{ steps.env.outputs.stage }}"
        steps:
            - name: "Resolve target environment"
              id: "env"
              env:
                  INPUT_ENVIRONMENT: "${{ inputs.environment }}"
                  INPUT_STAGE: "${{ inputs.stage }}"
              run: |
                  environment="${INPUT_ENVIRONMENT:-production}"
                  stage="${INPUT_STAGE:-$environment}"

                  case "$environment" in
                      production|staging|preview) ;;
                      *) echo "::error::unknown environment '$environment'"; exit 1 ;;
                  esac

                  # The stage ends up in resource names and a workers.dev hostname.
                  if [[ ! "$stage" =~ ^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$ ]]; then
                      echo "::error::the stage must be 1-20 lowercase letters, digits or hyphens"
                      exit 1
                  fi

                  # Production is the production environment and nothing else.
                  if [[ "$environment" == "production" && "$stage" != "production" ]] || [[ "$environment" != "production" && "$stage" == "production" ]]; then
                      echo "::error::the production stage belongs to the production environment only"
                      exit 1
                  fi

                  echo "deploy-env=${environment}" >> "$GITHUB_OUTPUT"
                  echo "stage=${stage}" >> "$GITHUB_OUTPUT"

    # -----------------------------------------------------------------
    # Step 2a: Build app & deploy all Cloudflare Workers via Alchemy
    #
    # Alchemy (alchemy.run) replaces per-worker `wrangler deploy` calls
    # with a single TypeScript IaC script that manages both the main
    # TanStack Start app and the document-parser service.
    # -----------------------------------------------------------------
    deploy-cloudflare:
        name: "Deploy Cloudflare Workers via Alchemy (${{ needs.resolve-env.outputs.stage }})"
        needs: "resolve-env"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 60
        permissions:
            contents: "read"
            deployments: "write"
        outputs:
            website-url: "${{ steps.alchemy.outputs.website-url }}"
        environment:
            name: "${{ needs.resolve-env.outputs.deploy-env }}"
            url: "${{ steps.alchemy.outputs.website-url }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "24"

            # The three origins the app is built against and the backend verifies its
            # tokens against, from ONE place so they cannot disagree. Production uses
            # its custom domains (the VITE_* secrets). Every other stage lives on the
            # environment's workers.dev subdomain under the Worker names alchemy.run.ts
            # gives it (`<name>-<stage>`), which is known before the build; the app
            # bakes these URLs in, so they cannot wait for the deploy to report them.
            - name: "Resolve the origins"
              id: "origins"
              env:
                  STAGE: "${{ needs.resolve-env.outputs.stage }}"
                  WORKERS_DEV_SUBDOMAIN: "${{ vars.WORKERS_DEV_SUBDOMAIN }}"
                  SECRET_SITE_URL: "${{ secrets.VITE_SITE_URL }}"
                  SECRET_LUNORA_URL: "${{ secrets.VITE_LUNORA_URL }}"
                  SECRET_GATEWAY_URL: "${{ secrets.VITE_LLM_GATEWAY_URL }}"
              run: |
                  if [[ "$STAGE" != "production" && -n "$WORKERS_DEV_SUBDOMAIN" ]]; then
                      site="https://neore-chat-${STAGE}.${WORKERS_DEV_SUBDOMAIN}.workers.dev"
                      backend="https://neore-backend-${STAGE}.${WORKERS_DEV_SUBDOMAIN}.workers.dev"
                      gateway="https://llm-gateway-${STAGE}.${WORKERS_DEV_SUBDOMAIN}.workers.dev"
                  else
                      site="$SECRET_SITE_URL"
                      backend="$SECRET_LUNORA_URL"
                      gateway="$SECRET_GATEWAY_URL"
                  fi

                  {
                      echo "site=${site}"
                      echo "backend=${backend}"
                      echo "gateway=${gateway}"
                  } >> "$GITHUB_OUTPUT"

            # Alchemy uploads services/document-parser AS BUILT (Rust,
            # worker-build) and refuses to start without `build/`.
            - name: "Setup Rust Worker toolchain"
              uses: "./.github/actions/setup-rust-worker"
              with:
                  cache-build: "false"

            # The web app and the Rust Worker share nothing, so they build side by side
            # (`parallel:` runs each in the background with an implicit wait-all at the
            # end, and the job fails if either does) instead of one after the other: the
            # Rust release build is the long pole (~6 minutes cold) and the web build is
            # the other. The packages build stays INSIDE the web step because the app
            # needs it first; nothing in the Rust build does.
            #
            # The packages are built here rather than carried between jobs as an artifact.
            # `upload-artifact` strips the least common ancestor of the matched
            # files, so `packages/*/dist/` with two emitting packages (ai and
            # service-sdk) uploaded as `ai/dist/...` and `service-sdk/dist/...`.
            # Extracting that to `.` produced `./ai/dist`, never
            # `packages/ai/dist` — so the app build failed to resolve
            # `@neore/ai/models`. The LCA also shifts with the number of
            # emitting packages, which makes the artifact path silently wrong
            # again on the next package that gains or loses a `dist`. The build
            # is ~20s and nx-cached; that is cheaper than the trap.
            - parallel:
                  - name: "Build the web app"
                    env:
                        # Node sizes the default old-space from available RAM: this is
                        # the standard runner (2-core/7GB), where Node picked
                        # ~2080MB — the build died there with "Ineffective mark-compacts
                        # near heap limit". It succeeds on a workstation whose default
                        # is 4144MB, so match that rather than guess upward; the peak
                        # is driven by the sourcemaps for the large code-split chunks
                        # (univer-sheet-editor ~5.5MB, vendor-diagrams ~2.8MB).
                        NODE_OPTIONS: "--max-old-space-size=4096"
                        VITE_DEBUG: "false"
                        # These three are REQUIRED by apps/web/src/lib/env.ts as
                        # `string().url()`. `emptyStringAsUndefined` is on, so an unset
                        # secret fails the build rather than degrading — which is what
                        # happened: the repo has no secrets set at all.
                        #
                        # `VITE_LUNORA_URL` names the BACKEND Worker — one Worker
                        # serves both `/_lunora/rpc` and `/api/auth/*` — and must agree
                        # with its `PUBLIC_ORIGIN`, or the browser signs tokens against
                        # one origin and the backend verifies them against another.
                        #
                        # There is deliberately no fallback. A `workers.dev` URL is
                        # `<worker>.<account-subdomain>.workers.dev`, and this
                        # workflow cannot know the account subdomain — the previous
                        # single-label guesses (`neore-backend.workers.dev`) resolve to
                        # nothing, which does not fail the build. It ships an app whose
                        # JWKS fetch cannot succeed, so every RPC comes back
                        # FORBIDDEN_SHARD. An unset secret failing the deploy is the
                        # cheaper outcome.
                        VITE_LUNORA_URL: "${{ steps.origins.outputs.backend }}"
                        VITE_LLM_GATEWAY_URL: "${{ steps.origins.outputs.gateway }}"
                        VITE_SITE_URL: "${{ steps.origins.outputs.site }}"
                        VITE_DPO_EMAIL: "${{ secrets.VITE_DPO_EMAIL }}"
                        VITE_DPO_NAME: "${{ secrets.VITE_DPO_NAME }}"
                        VITE_PRIVACY_POLICY_URL: "${{ secrets.VITE_PRIVACY_POLICY_URL }}"
                        VITE_C15T_MODE: "${{ secrets.VITE_C15T_MODE }}"
                        VITE_C15T_BACKEND_URL: "${{ secrets.VITE_C15T_BACKEND_URL }}"
                        VITE_POSTHOG_API_KEY: "${{ secrets.VITE_POSTHOG_API_KEY }}"
                        VITE_POSTHOG_HOST: "${{ secrets.VITE_POSTHOG_HOST }}"
                        POSTHOG_PERSONAL_API_KEY: "${{ secrets.POSTHOG_PERSONAL_API_KEY }}"
                        # Half of a pair. This is what makes the sign-up / sign-in
                        # forms render a Turnstile widget at all; the matching
                        # TURNSTILE_SECRET_KEY below is what verifies the token it
                        # produces. alchemy.run.ts refuses to deploy with one set and
                        # not the other, because each half alone fails silently — the
                        # secret alone kills every credential flow, the site key alone
                        # shows a challenge nothing checks.
                        VITE_TURNSTILE_SITE_KEY: "${{ secrets.VITE_TURNSTILE_SITE_KEY }}"
                    run: |
                        pnpm --workspace-root run build:packages
                        pnpm --dir apps/web build


                  - name: "Build the document-parser Worker"
                    run: "pnpm --filter document-parser run build:worker"

            # `vite build` writes a source map for every client and server chunk
            # (`sourcemap: "hidden"`): 2,700 files and ~118 MiB in dist/client alone, about
            # two thirds of what the Worker uploads as static assets, all of it publicly
            # served. They belong in PostHog, which maps a browser stack trace back to the
            # source through the `//# chunkId=` comment `inject` adds to each chunk, so:
            # inject + upload (client only; a Worker stack trace has no chunk to look up),
            # then delete every map before Alchemy uploads the directory. One build makes
            # both the chunks and the maps, so they cannot disagree. The CLI is pinned with
            # its checksum rather than installed from npm, whose installer runs a download
            # script and does not verify it. Without a key the maps are still deleted, and
            # a failed upload warns instead of failing a deploy over an error-tracking nicety.
            - name: "Upload the web source maps to PostHog, then delete them"
              env:
                  POSTHOG_CLI_API_KEY: "${{ secrets.POSTHOG_CLI_API_KEY }}"
                  POSTHOG_CLI_PROJECT_ID: "${{ vars.POSTHOG_PROJECT_ID }}"
                  VITE_POSTHOG_HOST: "${{ secrets.VITE_POSTHOG_HOST }}"
                  RELEASE_VERSION: "${{ github.sha }}"
                  RELEASE_BUILD: "${{ github.run_number }}"
              run: |
                  if [[ -z "$POSTHOG_CLI_API_KEY" || -z "$POSTHOG_CLI_PROJECT_ID" ]]; then
                      echo "::notice::POSTHOG_CLI_API_KEY / POSTHOG_PROJECT_ID are not set on this environment: the source maps are deleted without being uploaded."
                  else
                      # The CLI talks to the app host (eu.posthog.com), events go to eu.i.posthog.com.
                      export POSTHOG_CLI_HOST="${VITE_POSTHOG_HOST/.i./.}"

                      version="0.18.10"
                      sha256="29f2d4409f08205bab7d52f9cc919e964ea2c867ec568b3acdd9ee3eb4149c3d"
                      archive="posthog-cli-x86_64-unknown-linux-gnu.tar.gz"

                      # Only the checksum is fail-closed: a CLI we cannot trust must not run. A failed
                      # download or extraction, like a failed upload, must not skip the cleanup below.
                      if ! curl --fail --silent --show-error --location --output "$RUNNER_TEMP/$archive" \
                          "https://github.com/PostHog/posthog/releases/download/posthog-cli/v${version}/${archive}"; then
                          echo "::warning::Downloading the PostHog CLI failed: the source maps are deleted without being uploaded."
                      elif ! echo "${sha256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict -; then
                          echo "::error::The PostHog CLI checksum did not match."
                          exit 1
                      elif ! tar --extract --gzip --file "$RUNNER_TEMP/$archive" --directory "$RUNNER_TEMP"; then
                          echo "::warning::Extracting the PostHog CLI failed: the source maps are deleted without being uploaded."
                      elif ! "$RUNNER_TEMP/posthog-cli-x86_64-unknown-linux-gnu/posthog-cli" sourcemap process \
                          --directory apps/web/dist/client \
                          --release-name "neore-web" \
                          --release-version "$RELEASE_VERSION" \
                          --build "$RELEASE_BUILD" \
                          --delete-after; then
                          echo "::warning::Uploading the source maps to PostHog failed: browser errors from this deploy will not be un-minified."
                      fi
                  fi

                  find apps/web/dist -name '*.map' -delete

            # The upload takes minutes to hit Cloudflare's 64 MiB module cap; this takes a
            # second and names the largest modules when the web build crosses its budget.
            - name: "Check the web Worker's upload size"
              run: "pnpm exec tsx scripts/check-web-size.ts"

            - name: "Deploy all Cloudflare Workers via Alchemy"
              id: "alchemy"
              env:
                  CLOUDFLARE_API_TOKEN: "${{ secrets.CLOUDFLARE_API_TOKEN }}"
                  CLOUDFLARE_ACCOUNT_ID: "${{ secrets.CLOUDFLARE_ACCOUNT_ID }}"
                  # The Alchemy stage (names and state), not the GitHub environment.
                  DEPLOY_ENV: "${{ needs.resolve-env.outputs.stage }}"
                  # Skips Alchemy's lookup of the account's workers.dev subdomain, which
                  # a new account has none of until one is registered.
                  CLOUDFLARE_WORKERS_SUBDOMAIN: "${{ vars.WORKERS_DEV_SUBDOMAIN }}"
                  # Cloudflare Access in front of the web app of staging and preview
                  # ("true" on those environments once the account has a Zero Trust
                  # organisation and the token the Access permissions). Never production.
                  ACCESS_ENABLED: "${{ vars.ACCESS_ENABLED }}"
                  CI: "true"
                  # alchemy.run.ts refuses to deploy without every one of these
                  # (REQUIRED_DEPLOY_ENV) — there are deliberately no defaults,
                  # because a blank auth secret deploys a working-looking app
                  # with forgeable sessions.
                  #
                  # BACKEND_PUBLIC_ORIGIN is fed from the same value as
                  # VITE_LUNORA_URL (the "Resolve the origins" step) on
                  # purpose. That is the origin the app proxies /api/auth/* to,
                  # and the backend mints its JWTs with whatever host it is
                  # reached on, then verifies iss/aud against PUBLIC_ORIGIN. Two
                  # separate secrets would let those drift, and the failure is
                  # silent: every bearer token verifies as anonymous.
                  BACKEND_PUBLIC_ORIGIN: "${{ steps.origins.outputs.backend }}"
                  BETTER_AUTH_SECRET: "${{ secrets.BETTER_AUTH_SECRET }}"
                  ENCRYPTION_KEY: "${{ secrets.ENCRYPTION_KEY }}"
                  # Gateway -> backend only (chunk polling, usage reports, key
                  # validation, stream tokens). The backend reaches the gateway,
                  # the document parser, the NSFW checker and the browser renderer
                  # over service bindings — no URL and no secret for those.
                  LLM_GATEWAY_SIGNING_SECRET: "${{ secrets.LLM_GATEWAY_SIGNING_SECRET }}"
                  # The gateway's PUBLIC origin (custom domain, PUBLIC_GATEWAY_URL).
                  LLM_GATEWAY_URL: "${{ steps.origins.outputs.gateway }}"
                  # Authenticates the backend's own job dispatch (the jobs queue
                  # consumer and the SchedulerDO). A long random string; nothing
                  # outside the backend Worker ever sends it.
                  LUNORA_ADMIN_TOKEN: "${{ secrets.LUNORA_ADMIN_TOKEN }}"
                  R2_ENDPOINT: "${{ secrets.R2_ENDPOINT }}"
                  STORAGE_SIGNING_SECRET: "${{ secrets.STORAGE_SIGNING_SECRET }}"
                  # Outbound mail (`email/mailer.ts`). MAIL_FROM is the sender and is
                  # required in production. With RESEND_API_KEY unset, alchemy.run.ts
                  # binds Cloudflare Email Service (MAIL_FROM must be on its verified
                  # sending domain); set the key to send through Resend instead.
                  MAIL_FROM: "${{ secrets.MAIL_FROM }}"
                  RESEND_API_KEY: "${{ secrets.RESEND_API_KEY }}"
                  SITE_URL: "${{ steps.origins.outputs.site }}"
                  # Optional, but paired with VITE_TURNSTILE_SITE_KEY in the
                  # build step above — set both or neither. Unset on both sides
                  # means no captcha anywhere, which is what ships today.
                  TURNSTILE_SECRET_KEY: "${{ secrets.TURNSTILE_SECRET_KEY }}"
                  VITE_TURNSTILE_SITE_KEY: "${{ secrets.VITE_TURNSTILE_SITE_KEY }}"
                  ADOPT: "${{ inputs.adopt }}"
                  LOG_LEVEL: "${{ inputs.log_level }}"
                  DRY_RUN: "${{ inputs.dry_run }}"
                  #
                  # ---------------------------------------------------------
                  # Everything below is passed through to the backend Worker by
                  # `requiredEnvPassthrough` in alchemy.run.ts.
                  #
                  # These are NOT optional extras. `http.ts` runs `assertEnv()`
                  # on every request against the strict schema (the strict one
                  # applies to both stages), and most fields there are a bare
                  # `z.string()` — so an ABSENT key fails while an EMPTY one
                  # passes. An unset GitHub secret expands to "", which is
                  # exactly the "present but not configured" state the schema
                  # wants; a key omitted from this list instead 500s every
                  # request on a Worker that deployed green.
                  #
                  # Generated from `REQUIRED_ENV_KEYS` in
                  # backend/lunora/lib/env-validation.ts. Adding a field there
                  # means adding it here — `backend/deploy-env-bindings.test.ts`
                  # fails if the two drift.
                  # ---------------------------------------------------------
                  #
                  # Core. ADMIN is the one that decides whether anyone can ever
                  # sign up: registration is invite-only unless
                  # SIGNUP_INVITE_ONLY is "false"/"0", and the bootstrap
                  # (`lunora run auth_invitations:seedAdminInvitations`) throws
                  # "ADMIN is empty" without it. Comma-separated addresses.
                  ADMIN: "${{ secrets.ADMIN }}"
                  # Repository VARIABLE, not a secret: "false" opens registration.
                  SIGNUP_INVITE_ONLY: "${{ vars.SIGNUP_INVITE_ONLY }}"
                  JWKS: "${{ secrets.JWKS }}"
                  # Services
                  GOOGLE_CLIENT_ID: "${{ secrets.GOOGLE_CLIENT_ID }}"
                  GOOGLE_CLIENT_SECRET: "${{ secrets.GOOGLE_CLIENT_SECRET }}"
                  R2_ACCESS_KEY_ID: "${{ secrets.R2_ACCESS_KEY_ID }}"
                  R2_BUCKET: "${{ secrets.R2_BUCKET }}"
                  R2_SECRET_ACCESS_KEY: "${{ secrets.R2_SECRET_ACCESS_KEY }}"
                  R2_TOKEN: "${{ secrets.R2_TOKEN }}"
                  RESEND_WEBHOOK_SECRET: "${{ secrets.RESEND_WEBHOOK_SECRET }}"
                  # AI providers — the backend's own copies. The gateway is what
                  # actually calls the providers and takes its keys from the
                  # block further down; these satisfy the backend's schema and
                  # cover the paths that still read them directly.
                  FAL_API_KEY: "${{ secrets.FAL_API_KEY }}"
                  GROQ_API_KEY: "${{ secrets.GROQ_API_KEY }}"
                  OPENROUTER_API_KEY: "${{ secrets.OPENROUTER_API_KEY }}"
                  REPLICATE_API_TOKEN: "${{ secrets.REPLICATE_API_TOKEN }}"
                  REQUESTY_API_KEY: "${{ secrets.REQUESTY_API_KEY }}"
                  XAI_API_KEY: "${{ secrets.XAI_API_KEY }}"
                  # Tool APIs — each one an agent tool that degrades to
                  # unavailable when empty.
                  AMADEUS_CLIENT_ID: "${{ secrets.AMADEUS_CLIENT_ID }}"
                  AMADEUS_CLIENT_SECRET: "${{ secrets.AMADEUS_CLIENT_SECRET }}"
                  COINGECKO_API_KEY: "${{ secrets.COINGECKO_API_KEY }}"
                  E2B_API_KEY: "${{ secrets.E2B_API_KEY }}"
                  EXA_API_KEY: "${{ secrets.EXA_API_KEY }}"
                  FIRECRAWL_API_KEY: "${{ secrets.FIRECRAWL_API_KEY }}"
                  # NOT `secrets.GITHUB_TOKEN`. That name is reserved — GitHub
                  # refuses to create a secret under it and substitutes the
                  # workflow's own ephemeral Actions token, which would be
                  # baked into the Worker as a long-lived credential that
                  # expires minutes after the deploy. Use a PAT stored under a
                  # name of our own.
                  GITHUB_TOKEN: "${{ secrets.TOOLS_GITHUB_TOKEN }}"
                  GOOGLE_MAPS_API_KEY: "${{ secrets.GOOGLE_MAPS_API_KEY }}"
                  OPENWEATHER_API_KEY: "${{ secrets.OPENWEATHER_API_KEY }}"
                  PARALLEL_API_KEY: "${{ secrets.PARALLEL_API_KEY }}"
                  SPOTIFY_CLIENT_ID: "${{ secrets.SPOTIFY_CLIENT_ID }}"
                  SPOTIFY_CLIENT_SECRET: "${{ secrets.SPOTIFY_CLIENT_SECRET }}"
                  SUPADATA_API_KEY: "${{ secrets.SUPADATA_API_KEY }}"
                  TAVILY_API_KEY: "${{ secrets.TAVILY_API_KEY }}"
                  TMDB_API_KEY: "${{ secrets.TMDB_API_KEY }}"
                  VALYU_API_KEY: "${{ secrets.VALYU_API_KEY }}"
                  # Optional backend extras — bound only when non-empty.
                  CONNECTOR_ENCRYPTION_KEY: "${{ secrets.CONNECTOR_ENCRYPTION_KEY }}"
                  # GitHub reserves secret names starting with GITHUB_, hence the swap.
                  GITHUB_CONNECTOR_CLIENT_ID: "${{ secrets.CONNECTOR_GITHUB_CLIENT_ID }}"
                  GITHUB_CONNECTOR_CLIENT_SECRET: "${{ secrets.CONNECTOR_GITHUB_CLIENT_SECRET }}"
                  GOOGLE_CONNECTOR_CLIENT_ID: "${{ secrets.GOOGLE_CONNECTOR_CLIENT_ID }}"
                  GOOGLE_CONNECTOR_CLIENT_SECRET: "${{ secrets.GOOGLE_CONNECTOR_CLIENT_SECRET }}"
                  SLACK_CONNECTOR_CLIENT_ID: "${{ secrets.SLACK_CONNECTOR_CLIENT_ID }}"
                  SLACK_CONNECTOR_CLIENT_SECRET: "${{ secrets.SLACK_CONNECTOR_CLIENT_SECRET }}"
                  FEATUREBASE_API_KEY: "${{ secrets.FEATUREBASE_API_KEY }}"
                  # Creem subscriptions — checkout is off until CREEM_API_KEY is set.
                  CREEM_API_KEY: "${{ secrets.CREEM_API_KEY }}"
                  CREEM_PRODUCT_PRO: "${{ secrets.CREEM_PRODUCT_PRO }}"
                  CREEM_PRODUCT_TEAM: "${{ secrets.CREEM_PRODUCT_TEAM }}"
                  CREEM_TEST_MODE: "${{ secrets.CREEM_TEST_MODE }}"
                  CREEM_WEBHOOK_SECRET: "${{ secrets.CREEM_WEBHOOK_SECRET }}"
                  GOOGLE_GENERATIVE_AI_API_KEY: "${{ secrets.GOOGLE_GENERATIVE_AI_API_KEY }}"
                  # Optional sign-in providers — each is enabled only when its
                  # id AND secret are set. Register the redirect URI
                  # `${SITE_URL}/api/auth/callback/<github|microsoft|oidc>`.
                  AUTH_GITHUB_CLIENT_ID: "${{ secrets.AUTH_GITHUB_CLIENT_ID }}"
                  AUTH_GITHUB_CLIENT_SECRET: "${{ secrets.AUTH_GITHUB_CLIENT_SECRET }}"
                  MICROSOFT_CLIENT_ID: "${{ secrets.MICROSOFT_CLIENT_ID }}"
                  MICROSOFT_CLIENT_SECRET: "${{ secrets.MICROSOFT_CLIENT_SECRET }}"
                  MICROSOFT_TENANT_ID: "${{ secrets.MICROSOFT_TENANT_ID }}"
                  OIDC_ISSUER: "${{ secrets.OIDC_ISSUER }}"
                  OIDC_CLIENT_ID: "${{ secrets.OIDC_CLIENT_ID }}"
                  OIDC_CLIENT_SECRET: "${{ secrets.OIDC_CLIENT_SECRET }}"
                  OIDC_BUTTON_LABEL: "${{ secrets.OIDC_BUTTON_LABEL }}"
                  # Web Push — optional; push is off unless BOTH keys are set.
                  # Generate a P-256 pair once (e.g. `npx web-push
                  # generate-vapid-keys`); SUBJECT is a mailto: or https: URL.
                  VAPID_PUBLIC_KEY: "${{ secrets.VAPID_PUBLIC_KEY }}"
                  VAPID_PRIVATE_KEY: "${{ secrets.VAPID_PRIVATE_KEY }}"
                  VAPID_SUBJECT: "${{ secrets.VAPID_SUBJECT }}"
                  # Display name sent in connector OAuth client registration;
                  # unset = "Neore".
                  APP_NAME: "${{ secrets.APP_NAME }}"
                  POSTHOG_API_KEY: "${{ secrets.VITE_POSTHOG_API_KEY }}"
                  POSTHOG_HOST: "${{ secrets.VITE_POSTHOG_HOST }}"
                  POSTHOG_PERSONAL_API_KEY: "${{ secrets.POSTHOG_PERSONAL_API_KEY }}"
                  # Realtime dictation token for the web Worker; unset = Web Speech fallback.
                  ELEVENLABS_API_KEY: "${{ secrets.ELEVENLABS_API_KEY }}"
                  POSTHOG_PROJECT_ID: "${{ vars.POSTHOG_PROJECT_ID }}"
                  # The address the account-deletion email names; the web build
                  # shows the same one (VITE_DPO_EMAIL).
                  DPO_EMAIL: "${{ secrets.VITE_DPO_EMAIL }}"
                  # Published browser-extension origin(s), comma-separated:
                  # chrome-extension://<store id>. Unset = the extension cannot
                  # sign in; a wildcard is ignored, never honoured.
                  TRUSTED_EXTENSION_ORIGINS: "${{ secrets.TRUSTED_EXTENSION_ORIGINS }}"
                  # Firefox extension sign-in redirect URI(s). Leave the secret
                  # unset: the backend defaults to the shipped add-on id's URI.
                  # Set it only for another gecko id, or to "none" to turn the
                  # Firefox sign-in off. A value replaces the default.
                  TRUSTED_EXTENSION_REDIRECT_URIS: "${{ secrets.TRUSTED_EXTENSION_REDIRECT_URIS }}"
                  WOLFRAM_APP_ID: "${{ secrets.WOLFRAM_APP_ID }}"
                  #
                  # ---------------------------------------------------------
                  # LLM Gateway provider keys. The gateway is what actually
                  # calls the model providers, and `AppEnv` marks all of these
                  # optional — so without them it boots fine and every model
                  # call fails unless the user brought their own key. Bound only
                  # when non-empty.
                  # ---------------------------------------------------------
                  BFL_API_KEY: "${{ secrets.BFL_API_KEY }}"
                  CLOUDFLARE_API_KEY: "${{ secrets.CLOUDFLARE_API_KEY }}"
                  GATEWAY_ADMIN_USER_IDS: "${{ secrets.GATEWAY_ADMIN_USER_IDS }}"
                  GOOGLE_API_KEY: "${{ secrets.GOOGLE_API_KEY }}"
                  OPENAI_API_KEY: "${{ secrets.OPENAI_API_KEY }}"
                  OTEL_EXPORTER_OTLP_ENDPOINT: "${{ secrets.OTEL_EXPORTER_OTLP_ENDPOINT }}"
                  OTEL_EXPORTER_OTLP_HEADERS: "${{ secrets.OTEL_EXPORTER_OTLP_HEADERS }}"
              run: |
                  # `--stage` equals DEPLOY_ENV (the stage), which alchemy.run.ts reads for the physical
                  # names: the state scope and the names cannot disagree. `--yes` skips the
                  # approval prompt (and bootstraps the state store on its first run).
                  # `--adopt` takes over resources of the same name that something else
                  # created: only for a first deploy over such resources, hence an input.
                  args=(deploy --stage "$DEPLOY_ENV" --yes --log-level "${LOG_LEVEL:-info}")
                  if [[ "$ADOPT" == "true" ]]; then args+=(--adopt); fi
                  if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi

                  pnpm exec alchemy provider check-env --provider Cloudflare
                  output=$(pnpm exec alchemy "${args[@]}" 2>&1) || { echo "$output"; exit 1; }
                  echo "$output"

                  # Extract website URL from Alchemy output for GitHub environment
                  url=$(echo "$output" | grep -oP "website: ['\"]?\Khttps?://[^'\"}\s]+" || true)
                  echo "website-url=${url}" >> "$GITHUB_OUTPUT"

            # Alchemy bundles every Worker itself (rolldown), so this is the script Cloudflare
            # actually validates; `lunora build`'s bundle is a different one. Kept on failure too,
            # because "Script startup exceeded CPU time limit" is rejected at upload, which is
            # exactly when the bundle is wanted: profile it with
            # `scripts/profile-worker-startup.ts`. Three days is plenty; the maps are the bulk.
            - name: "Keep the Worker bundles"
              if: "${{ !cancelled() && !inputs.dry_run }}"
              uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              with:
                  if-no-files-found: "warn"
                  name: "worker-bundles-${{ needs.resolve-env.outputs.stage }}"
                  path: ".alchemy/bundles"
                  retention-days: 3

    # -----------------------------------------------------------------
    # There is no separate backend deploy job.
    #
    # The backend is the `neore-backend` Worker in `alchemy.run.ts`, so it
    # goes out with everything else in the Alchemy step above and needs no
    # job of its own.
    # -----------------------------------------------------------------

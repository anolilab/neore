# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Tests"

on: # yamllint disable-line rule:truthy
    # eslint-disable-next-line yml/no-empty-mapping-value
    pull_request: # yamllint disable-line rule:empty-values
        types: ["opened", "synchronize", "reopened"]
    merge_group: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read" # to fetch code (actions/checkout)

env:
    HEAD_REF: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref_name }}"
    HEAD_REPOSITORY: "${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}"
    VIS_BASE: "${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha || github.event.before }}"
    VIS_HEAD: "${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}"

jobs:
    files-changed:
        name: "Detect what files changed"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 3
        # `dorny/paths-filter` resolves a PR's file list through the REST API
        # (`GET /repos/{owner}/{repo}/pulls/{n}/files`), not from the git diff, so
        # `contents: read` alone is not enough — the call comes back
        # `Resource not accessible by integration` and the job fails before any
        # test runs. Granted per-job rather than at workflow level so the other
        # jobs keep the minimal default above.
        permissions:
            contents: "read"
            pull-requests: "read"
        outputs:
            packages: "${{ steps.changes.outputs.packages }}"
            e2e: "${{ steps.changes.outputs.e2e }}"
            desktop: "${{ steps.changes.outputs.desktop }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Check for file changes"
              uses: "dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d" # v4.0.1
              id: "changes"
              with:
                  token: "${{ github.token }}"
                  filters: ".github/file-filters.yml"

    test:
        name: "Test (node-24)"
        if: "needs.files-changed.outputs.packages == 'true'"
        needs: "files-changed"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 60
        env:
            # Surfaced as env because the `secrets` context is not available in a
            # step-level `if:` — see the codecov step below.
            CODECOV_TOKEN: "${{ secrets.CODECOV_TOKEN }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout ${{ env.HEAD_REPOSITORY }}:${{ env.HEAD_REF }}"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "24.22.1"
                  npm-version: "11"

            # services/document-parser is a Rust Worker: its `build:worker`
            # (which `test` depends on, and `lunora dev` runs on start) needs
            # rustc + wasm32 + worker-build.
            - name: "Setup Rust Worker toolchain"
              uses: "./.github/actions/setup-rust-worker"

            # Build it ONCE, up front, as the E2E job does. Otherwise several test
            # suites start wrangler with its `build.command` at the same time, each
            # triggers a cold ~6 min worker-build, and all but the first time out on
            # its lock ("Timed out waiting for concurrent worker-build to finish").
            # Later runs skip the build because `build/` is newer than the sources.
            - name: "Build the document-parser Worker"
              shell: "bash"
              run: "pnpm --filter document-parser run build:worker"

            # `vis affected build` also builds packages/device-core-node, whose Linux
            # keyring backend links libdbus at build time (see the Rust job below).
            - name: "Install libdbus for the Linux keyring"
              shell: "bash"
              run: "bash .github/scripts/apt-retry.sh sudo apt-get install -y libdbus-1-dev pkg-config"

            - name: "Build affected packages"
              shell: "bash"
              env:
                  # Same fix, same reason as `deploy.yml`'s "Build app" step: the
                  # standard runner is 2-core/7GB and Node sizes its default
                  # old-space at ~2080MB. `@neore/web:build` dies there
                  # with "FATAL ERROR: Ineffective mark-compacts near heap limit",
                  # driven by the sourcemaps for the large code-split chunks
                  # (univer-sheet-editor ~11MB, vendor-diagrams ~3.7MB).
                  NODE_OPTIONS: "--max-old-space-size=4096"
              run: 'pnpm exec vis affected build --base "$VIS_BASE" --head "$VIS_HEAD" --fail-fast'

            # `--parallel 2`: the standard runner is 2-core/7GB and every project's vitest spawns its own
            # worker pool, so running all of them at once starved the suites (trivial tests timing out at
            # 5 s, a 50 ms tokenizer taking 5.6 s). Two at a time keeps the run well inside the timeout.
            - name: "Run tests (affected)"
              shell: "bash"
              run: 'pnpm exec vis affected test:coverage --if-present --base "$VIS_BASE" --head "$VIS_HEAD" --fail-fast --parallel 2'

            # Skipped when CODECOV_TOKEN is unavailable, which is the normal case
            # for a pull_request from a fork: secrets are not exposed there, so
            # the upload would fail for a reason that has nothing to do with the
            # code under test. The base report PRs are diffed against comes from
            # `full-test.yml` (push to main).
            - name: "Upload code coverage to codecov"
              if: "env.CODECOV_TOKEN != ''"
              continue-on-error: true
              uses: "codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac" # v5.5.5
              with:
                  token: "${{ secrets.CODECOV_TOKEN }}"
                  fail_ci_if_error: false

    # The Rust Worker is the one project with a `test` target and no `test:coverage`
    # (cargo test has no v8 coverage), so the coverage run in `test` skips it. Its own
    # job, in parallel: it needs no workspace build and was the tail of `test`.
    rust-worker:
        name: "Rust Worker tests"
        if: "needs.files-changed.outputs.packages == 'true'"
        needs: "files-changed"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 45
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "24.22.1"
                  npm-version: "11"
                  skip-playwright: "true"

            - name: "Setup Rust Worker toolchain"
              uses: "./.github/actions/setup-rust-worker"

            - name: "Build the document-parser Worker"
              shell: "bash"
              run: "pnpm --filter document-parser run build:worker"

            - name: "Run the Rust Worker tests (affected)"
              shell: "bash"
              run: 'pnpm exec vis affected test --tag document-parser --base "$VIS_BASE" --head "$VIS_HEAD" --fail-fast'

    e2e:
        name: "E2E (chromium, shard ${{ matrix.shard }}/3)"
        # Only what the browser suite exercises, and split three ways: one worker ran all
        # 59 tests in ~12 minutes of the job, and the shards each get their own backend.
        if: "needs.files-changed.outputs.e2e == 'true'"
        needs: "files-changed"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 45
        strategy:
            fail-fast: false
            matrix:
                shard: [1, 2, 3]
        env:
            # `apps/web/src/lib/env.ts` declares these three as bare `z.url()` —
            # NOT optional — so a missing one is a hard boot failure
            # ("Invalid environment variables"), not a degraded mode. Locally they
            # come from `apps/web/.env`, which only `scripts/dev-setup.js` writes;
            # that script is interactive (readline) and so cannot run here, and
            # nothing else created the file. The app dev server therefore never
            # served `/models` and Playwright sat out its full 300s `webServer`
            # timeout. Values mirror what dev-setup writes, and the ports match
            # `playwright.config.ts` (APP 5173 / BACKEND 8788).
            #
            # VITE_LUNORA_URL must equal the backend's PUBLIC_ORIGIN or every
            # bearer token verifies as anonymous with no error at all.
            VITE_LUNORA_URL: "http://localhost:8788"
            VITE_SITE_URL: "http://localhost:5173"
            VITE_LLM_GATEWAY_URL: "http://localhost:5173/llm-gateway"
        # No Harden Runner here, unlike the other jobs. Its audit agent grows by about 200 MiB every 15 s
        # while the suite runs (thousands of loopback connections between the browser, vite and the local
        # Workers): 4 GiB within four minutes, on a 16 GiB runner already holding vite, the backend and
        # Chromium. The VM ran out of memory and the job died with "The runner has received a shutdown
        # signal" (exit 143). The policy was audit-only, so nothing it blocked is lost.
        steps:
            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  fetch-depth: 0
                  persist-credentials: false

            - name: "Setup resources and environment"
              id: "setup"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "24.22.1"
                  npm-version: "11"

            # Playwright's first `webServer` is the backend, and `buildAuth(env)`
            # refuses to start without a signing secret:
            #
            #   Error: AUTH_SECRET (or BETTER_AUTH_SECRET) is not set — refusing to
            #   start rather than sign sessions with better-auth's public default key.
            #
            # `/api/health` then returns 500 forever, Playwright waits for a 2xx,
            # and the job dies on `Timed out waiting 300000ms from config.webServer`
            # — which reads like a slow boot rather than a missing binding.
            # Reproduced locally by moving `backend/.dev.vars` aside.
            #
            # That file is gitignored and only `scripts/dev-setup.js` writes it,
            # which is interactive (readline) and cannot run here. These are
            # throwaway values generated per run: the e2e suite signs up real
            # users against a local D1 that is discarded with the runner, so the
            # secret only has to be a secret for the length of the job.
            - name: "Write throwaway backend secrets for the e2e run"
              shell: "bash"
              run: |
                  # Shared with the gateway's `.dev.vars` in the next step.
                  GATEWAY_SECRET="$(openssl rand -hex 32)"
                  echo "GATEWAY_SECRET=$GATEWAY_SECRET" >> "$GITHUB_ENV"
                  {
                      # `ENVIRONMENT` is load-bearing, not decoration: `parseEnv()`
                      # in `lunora/lib/env-validation.ts` picks
                      # `developmentEnvSchema` only when it is exactly
                      # "development", and that variant is what turns the service,
                      # AI-provider and tool-API groups into optional-with-default.
                      # Without it the strict schema applies and the worker demands
                      # all 37 keys (R2, Resend, every provider token) before it
                      # will answer a request.
                      echo "ENVIRONMENT=\"development\""

                      # The rest of `coreEnvSchema`, which stays required either
                      # way. ADMIN and JWKS are plain `z.string().trim()` with no
                      # `.min()`, so empty is valid — they just have to be PRESENT.
                      echo "ADMIN=\"\""
                      echo "JWKS=\"\""
                      echo "SITE_URL=\"$VITE_SITE_URL\""

                      # AUTH_SECRET is checked separately by `buildAuth()`, before
                      # assertEnv ever runs. ENCRYPTION_KEY needs >= 32 chars;
                      # base64 of 32 bytes is 44.
                      echo "AUTH_SECRET=\"$(openssl rand -hex 32)\""
                      echo "BETTER_AUTH_SECRET=\"$(openssl rand -hex 32)\""
                      echo "ENCRYPTION_KEY=\"$(openssl rand -base64 32)\""
                      echo "CONNECTOR_ENCRYPTION_KEY=\"$(openssl rand -hex 32)\""
                      # Signs storage download URLs; without it every signed download 500s.
                      echo "STORAGE_SIGNING_SECRET=\"$(openssl rand -hex 32)\""
                      # Unlocks `POST /e2e/invitations`, which `apps/web/e2e/seed.ts`
                      # seeds through; the suite reads it back from this file.
                      echo "E2E_SEED_TOKEN=\"$(openssl rand -hex 32)\""

                      # Loopback origins. They cannot live in wrangler.jsonc
                      # (`lunora build` blocks on loopback addresses there), and
                      # `requirePublicOrigin` in `src/server.ts` fails every request
                      # without PUBLIC_ORIGIN. LUNORA_ORIGIN_URL is what the
                      # SchedulerDO calls back on; both must equal the dev port.
                      echo "PUBLIC_ORIGIN=\"http://localhost:8788\""
                      echo "LUNORA_ORIGIN_URL=\"http://localhost:8788\""

                      # The deletion workflow's confirmation email reads MAIL_FROM
                      # before it picks a transport, so a missing one fails that step
                      # on every retry and the workflow never reaches its last step.
                      echo "MAIL_FROM=\"Neore <noreply@neore.localhost>\""

                      # Every model call goes through the LLM gateway — over the
                      # `SERVICE_LLM_GATEWAY` binding, to the copy `lunora dev`
                      # runs inside the backend's session (no URL). The secret is
                      # the gateway -> backend direction (chunk polling, usage
                      # reports, stream tokens): both ends equal, or a 401.
                      echo "LLM_GATEWAY_SIGNING_SECRET=\"$GATEWAY_SECRET\""
                  } > backend/.dev.vars

            # The gateway runs the deterministic mock model (`MOCK_LLM=1`, see
            # `services/llm-gateway/src/providers/mock-model.ts`), so the chat
            # specs need no provider key and assert on exact replies. The flag is
            # refused when NODE_ENV is production — it fails every request.
            - name: "Write the LLM gateway's dev vars (mock model)"
              shell: "bash"
              run: |
                  {
                      echo "NODE_ENV=\"development\""
                      echo "MOCK_LLM=\"1\""
                      echo "SIGNING_SECRET=\"$GATEWAY_SECRET\""
                      echo "LUNORA_URL=\"http://localhost:8788\""
                      echo "ALLOWED_ORIGINS=\"$VITE_SITE_URL\""
                  } > services/llm-gateway/.dev.vars
                  # Usage tracking and provider health write to D1 after every
                  # call; an unmigrated local database only logs, but migrate so
                  # the run reads like a real one. Twice: the public gateway on
                  # :8787 (the browser's `/v1/*`, Playwright's second webServer)
                  # and the binding target inside the backend's `lunora dev`
                  # session, which persists to the backend's state directory.
                  pnpm --filter llm-gateway exec wrangler d1 migrations apply llm-gateway-usage-dev --local
                  pnpm --filter llm-gateway exec wrangler d1 migrations apply llm-gateway-usage-dev --local --persist-to ../../backend/.wrangler/state

            - name: "Build workspace packages"
              shell: "bash"
              run: "pnpm run build:packages"

            # The backend's `lunora dev` session runs services/document-parser,
            # a Rust Worker, and builds it on start. Built up front so a
            # toolchain problem fails here, named, not as a backend that never
            # comes up inside Playwright's webServer timeout.
            - name: "Setup Rust Worker toolchain"
              uses: "./.github/actions/setup-rust-worker"

            - name: "Build the document-parser Worker"
              shell: "bash"
              run: "pnpm --filter document-parser run build:worker"

            # `apps/web/.source` holds the `fumadocs-mdx:collections/*` virtual
            # modules and is gitignored, so a fresh checkout has none. `vite build`
            # is fine — the mdx plugin generates them during the build — but
            # `vite dev` is not: the dependency SCAN runs before the plugin, so it
            # reports
            #
            #   Failed to run dependency scan. Skipping dependency pre-bundling.
            #   fumadocs-mdx:collections/browser (imported by src/routes/docs/$.tsx)
            #
            # and that "Skipping" is the part that matters — without pre-bundling
            # React is no longer deduped to one instance, SSR dies on
            # "Invalid hook call", the dev server goes down, and all 26 e2e tests
            # fail with ERR_CONNECTION_REFUSED at localhost:5173. Generating up
            # front costs ~3ms and is deterministic.
            - name: "Generate fumadocs sources"
              shell: "bash"
              run: "pnpm --filter @neore/web exec fumadocs-mdx"

            - name: "Resolve the Playwright version"
              id: "playwright"
              shell: "bash"
              run: 'echo "version=$(pnpm --filter @neore/web exec playwright --version | awk ''{print $2}'')" >> "$GITHUB_OUTPUT"'

            # The browser download is the slow half of `playwright install --with-deps`;
            # the system libraries live outside the cache and are always installed.
            - name: "Cache Playwright browsers"
              id: "playwright-cache"
              uses: "actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9" # v6.1.0
              with:
                  path: "~/.cache/ms-playwright"
                  key: "playwright-${{ runner.os }}-${{ steps.playwright.outputs.version }}"

            - name: "Install Chromium"
              if: "steps.playwright-cache.outputs.cache-hit != 'true'"
              shell: "bash"
              run: "bash .github/scripts/apt-retry.sh pnpm --filter @neore/web exec playwright install --with-deps chromium"

            - name: "Install Chromium system dependencies (browsers cached)"
              if: "steps.playwright-cache.outputs.cache-hit == 'true'"
              shell: "bash"
              run: "bash .github/scripts/apt-retry.sh pnpm --filter @neore/web exec playwright install-deps chromium"

            # Playwright's webServer starts the Lunora backend and the app itself.
            # No TURNSTILE_SECRET_KEY is set here, so better-auth loads without the
            # captcha plugin and the credential flows are exercised for real; a
            # runner that does set it would skip them with a reason rather than
            # time out twelve times over.
            #
            # The sampler prints memory, disk and the largest processes every 5s.
            # Shard 3 has been dying mid-test with "The runner has received a
            # shutdown signal" (exit 143) during the guest-conversion test, and a
            # killed runner skips every later step, so nothing uploads; only this
            # step's own output survives up to the kill.
            - name: "Run e2e tests"
              shell: "bash"
              run: |
                  (
                      # The step runs under `-eo pipefail`; a SIGPIPE from `head` must not end the loop.
                      set +eo pipefail
                      while sleep 5; do
                          free -m | awk -v disk="$(df -h --output=avail / | tail -1 | tr -d ' ')" \
                              '/^Mem:/ { mem = sprintf("mem used %s of %s MiB, available %s MiB", $3, $2, $7) }
                               /^Swap:/ { swap = sprintf("swap used %s MiB", $3) }
                               END { printf "[resources] %s, %s, disk free %s\n", mem, swap, disk }'
                          ps -eo rss=,args= --sort=-rss | head -4 | awk '{ rss = $1; $1 = ""; printf "[resources]   %5d MiB%s\n", rss / 1024, substr($0, 1, 90) }'
                      done
                  ) &
                  sampler=$!
                  # The sampler's own `sleep` child holds stdout too: end it with the loop, or the step waits on it.
                  # `|| true`: the step runs under `-e`, and a pkill that finds no child (or a sampler already gone)
                  # would otherwise turn a passing run into exit 1.
                  trap 'pkill -P "$sampler" 2>/dev/null || true; kill "$sampler" 2>/dev/null || true' EXIT
                  pnpm --filter @neore/web run test:e2e --shard=${{ matrix.shard }}/3

            - name: "Upload the Playwright report"
              if: "!cancelled()"
              uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              with:
                  # `.report` is a DOTTED directory and `upload-artifact` skips
                  # hidden files unless told otherwise, so every run so far
                  # uploaded nothing:
                  #   No files were found with the provided path:
                  #   apps/web/e2e/.report. No artifacts will be uploaded.
                  # The step still reported success, so the report was silently
                  # missing exactly when a failing run needed it.
                  include-hidden-files: "true"
                  name: "playwright-report-${{ matrix.shard }}"
                  path: "apps/web/e2e/.report"
                  retention-days: 7

    # packages/device-core is the Rust core of the desktop shell's device execution. The
    # `test` job covers the Worker only, so the core's own tests run here on each OS it
    # targets. Toolchain and cache pins match desktop.yml.
    device-core:
        name: "Rust device-core tests (${{ matrix.os }})"
        runs-on: "${{ matrix.os }}"
        timeout-minutes: 30
        strategy:
            fail-fast: false
            matrix:
                os: ["ubuntu-22.04", "windows-latest", "macos-latest"]
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Install Rust (stable)"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # master
              with:
                  toolchain: "stable"

            - name: "Cache Rust build"
              uses: "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6" # v2.9.2
              with:
                  workspaces: "packages/device-core -> target"

            # The Linux keyring backend (`keyring`'s Secret Service) links libdbus at build time.
            - name: "Install libdbus for the Linux keyring"
              if: "matrix.os == 'ubuntu-22.04'"
              run: "bash .github/scripts/apt-retry.sh sudo apt-get install -y libdbus-1-dev pkg-config"

            # The SSH transport tests (`tests/ssh_host.rs`) start a throwaway `sshd` on 127.0.0.1, as the
            # runner's own user with its own host key. Ubuntu needs the privilege-separation directory to exist.
            - name: "Install sshd for the SSH transport tests"
              if: "matrix.os == 'ubuntu-22.04'"
              run: "bash .github/scripts/apt-retry.sh sudo apt-get install -y openssh-server openssh-client && sudo mkdir -p /run/sshd"

            # rustfmt is OS-independent, so it runs once, on the Linux leg.
            - name: "Check Rust formatting"
              if: "matrix.os == 'ubuntu-22.04'"
              shell: "bash"
              run: "cargo fmt --manifest-path packages/device-core/Cargo.toml -- --check && cargo fmt --manifest-path packages/device-core-node/Cargo.toml -- --check"

            # Linux and macOS have a shell sandbox, so the sandboxed vectors must run there instead of
            # being skipped when the runner loses it; they also have an sshd, which the SSH tests need.
            - name: "Run cargo test"
              shell: "bash"
              env:
                  NEORE_REQUIRE_SANDBOX: "${{ matrix.os != 'windows-latest' && '1' || '' }}"
                  NEORE_REQUIRE_SSHD: "${{ matrix.os != 'windows-latest' && '1' || '' }}"
              run: "cargo test --manifest-path packages/device-core/Cargo.toml"

            # Records whether this runner's OpenSSH can multiplex (ControlMaster), for the plan's S5 note. The
            # step fails when it cannot reach a verdict (no sshd, no login), so a broken setup gets fixed.
            - name: "Measure ssh ControlMaster (Windows)"
              if: "matrix.os == 'windows-latest'"
              shell: "pwsh"
              run: "./packages/device-core/tests/ssh-mux-windows.ps1"

            # `neore-host` is built without the `keychain` feature. This runs the host's own tests
            # (the stdio protocol, the action vectors, the no-socket check) and proves the crate
            # builds and passes without the paired side.
            - name: "Run cargo test without the keychain feature"
              shell: "bash"
              env:
                  NEORE_REQUIRE_SANDBOX: "${{ matrix.os != 'windows-latest' && '1' || '' }}"
              run: "cargo test --manifest-path packages/device-core/Cargo.toml --no-default-features"

            # The host holds no pairing, so it must not link the keyring (or libdbus, which the
            # keyring's Secret Service backend needs). Runs after libdbus-dev is installed, so a
            # regression would link it instead of failing to build.
            - name: "Check neore-host links no keyring"
              if: "matrix.os == 'ubuntu-22.04'"
              shell: "bash"
              run: |
                  set -euo pipefail
                  manifest=packages/device-core/Cargo.toml
                  # `cargo tree -i` exits 0 when the package is in the tree and non-zero when it is not,
                  # so the default build is the control that the command can find it at all.
                  cargo tree --manifest-path "$manifest" --target all -e normal,build -i keyring > /dev/null
                  if cargo tree --manifest-path "$manifest" --no-default-features --target all -e normal,build -i keyring; then
                      echo "keyring is in the neore-host dependency tree" >&2
                      exit 1
                  fi
                  cargo build --manifest-path "$manifest" --release --no-default-features --bin neore-host
                  binary=packages/device-core/target/release/neore-host
                  # Captured first: under pipefail an early `grep -q` exit could SIGPIPE the producer and hide a match.
                  deps="$(ldd "$binary")"
                  echo "$deps"
                  if grep -qi dbus <<< "$deps"; then
                      echo "neore-host links libdbus" >&2
                      exit 1
                  fi
                  strings "$binary" > "$RUNNER_TEMP/neore-host.strings"
                  if grep -q "dev.neore.device" "$RUNNER_TEMP/neore-host.strings"; then
                      echo "neore-host carries the keychain service name" >&2
                      exit 1
                  fi

            # The binary that gets copied to a remote machine must not depend on that machine's libc.
            # A static musl build runs on any Linux of the same architecture, so it is built, checked for
            # dynamic dependencies, and put through the stdio tests (`NEORE_HOST_BIN` points them at it).
            - name: "Build neore-host static (musl) and run the stdio tests against it"
              if: "matrix.os == 'ubuntu-22.04'"
              shell: "bash"
              env:
                  NEORE_REQUIRE_SANDBOX: "1"
              run: |
                  set -euo pipefail
                  bash .github/scripts/apt-retry.sh sudo apt-get install -y musl-tools
                  rustup target add x86_64-unknown-linux-musl
                  manifest=packages/device-core/Cargo.toml
                  cargo build --manifest-path "$manifest" --release --no-default-features --bin neore-host --target x86_64-unknown-linux-musl
                  binary="$PWD/packages/device-core/target/x86_64-unknown-linux-musl/release/neore-host"
                  file "$binary"
                  ldd "$binary" || true
                  # A static binary names no interpreter and no shared library. (`set -e` ignores a bare `!`.)
                  if readelf -l "$binary" | grep -q INTERP || readelf -d "$binary" | grep -q NEEDED; then
                      echo "neore-host is dynamically linked" >&2
                      exit 1
                  fi
                  NEORE_HOST_BIN="$binary" cargo test --manifest-path "$manifest" --no-default-features --test host_stdio

    # Packages the desktop shell without signing, so a packager break (the xmldom override,
    # a missing addon in the asar) shows on the PR instead of at the next `desktop-v*` tag.
    # Linux x64 only: it is the cheapest runner, and desktop.yml still builds every platform
    # on a tag. `--dir` writes the unpacked app and no installer, so nothing is published.
    desktop-package:
        name: "Desktop package (linux-x64)"
        if: "needs.files-changed.outputs.desktop == 'true'"
        needs: "files-changed"
        runs-on: "ubuntu-22.04"
        timeout-minutes: 45
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "22"
                  skip-playwright: "true"

            - name: "Install Rust (stable)"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # master
              with:
                  toolchain: "stable"

            - name: "Cache Rust build"
              uses: "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6" # v2.9.2
              with:
                  workspaces: "packages/device-core-node -> target"

            - name: "Install libdbus for the Linux keyring"
              run: "bash .github/scripts/apt-retry.sh sudo apt-get install -y libdbus-1-dev pkg-config"

            - name: "Build the device-execution addon"
              run: "pnpm --filter @neore/device-core-node run build"

            # The shell bundles `@neore/ai/capabilities` (plain data, read through its built `dist/`), and nothing
            # else builds that package on this job.
            - name: "Build the shared capability rules"
              run: "pnpm --filter @neore/ai run build"

            - name: "Bundle the main process and preloads"
              run: "pnpm --filter @neore/desktop run build"

            - name: "Smoke-test the bundles and the addon"
              run: "pnpm --filter @neore/desktop run smoke"

            - name: "Package the unpacked Linux app"
              run: "pnpm --filter @neore/desktop exec electron-builder --dir --linux --x64 --config electron-builder.yml --publish never"

    # The macOS half of the desktop check. It builds the addon and the shell bundles and runs the
    # smoke test, and stops there: no installer, no signing, nothing published. A break that only
    # shows on darwin (the addon's link step, the sandbox code path) surfaces here, not on the tag.
    desktop-macos-check:
        name: "Desktop check (macos-arm64)"
        if: "needs.files-changed.outputs.desktop == 'true'"
        needs: "files-changed"
        runs-on: "macos-latest"
        timeout-minutes: 45
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "22"
                  skip-playwright: "true"

            - name: "Install Rust (stable)"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # master
              with:
                  toolchain: "stable"

            - name: "Cache Rust build"
              uses: "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6" # v2.9.2
              with:
                  workspaces: "packages/device-core-node -> target"

            - name: "Build the device-execution addon"
              run: "pnpm --filter @neore/device-core-node run build"

            # The shell bundles `@neore/ai/capabilities` (plain data, read through its built `dist/`), and nothing
            # else builds that package on this job.
            - name: "Build the shared capability rules"
              run: "pnpm --filter @neore/ai run build"

            - name: "Bundle the main process and preloads"
              run: "pnpm --filter @neore/desktop run build"

            - name: "Smoke-test the bundles and the addon"
              run: "pnpm --filter @neore/desktop run smoke"

            # Launches the real shell: a terminal opens, runs a command and survives a reload, and every
            # shell is gone after quit. Only the terminal cases run here; the rest of the suite is not green yet.
            - name: "Run the terminal end-to-end tests"
              run: "pnpm --filter @neore/desktop exec playwright test --grep terminal"

    # The Windows half of the desktop check, for the terminal: its shell runs on ConPTY, which only a Windows
    # runner can exercise. It builds the addon and the bundles, runs the terminal's unit and real-pty tests, packages
    # the app unpacked (node-pty must sit outside the asar there) and launches the real shell for the terminal
    # end-to-end cases. Nothing is signed or published.
    desktop-windows-check:
        name: "Desktop check (windows-x64)"
        if: "needs.files-changed.outputs.desktop == 'true'"
        needs: "files-changed"
        runs-on: "windows-latest"
        timeout-minutes: 60
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "22"
                  skip-playwright: "true"

            - name: "Install Rust (stable)"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # master
              with:
                  toolchain: "stable"

            - name: "Cache Rust build"
              uses: "Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6" # v2.9.2
              with:
                  workspaces: "packages/device-core-node -> target"

            - name: "Build the device-execution addon"
              run: "pnpm --filter @neore/device-core-node run build"

            # The shell bundles `@neore/ai/capabilities` (plain data, read through its built `dist/`), and nothing
            # else builds that package on this job.
            - name: "Build the shared capability rules"
              run: "pnpm --filter @neore/ai run build"

            - name: "Bundle the main process and preloads"
              run: "pnpm --filter @neore/desktop run build"

            - name: "Smoke-test the bundles and the addon"
              run: "pnpm --filter @neore/desktop run smoke"

            # The shell on a real ConPTY: the host process, the session and the shell selection. The rest of the
            # desktop unit tests are not part of this job yet.
            - name: "Run the terminal unit and pseudo-terminal tests"
              run: "pnpm --filter @neore/desktop exec vitest run src/terminal"

            - name: "Package the unpacked Windows app"
              run: "pnpm --filter @neore/desktop exec electron-builder --dir --win --x64 --config electron-builder.yml --publish never"

            - name: "Check node-pty sits outside the asar"
              run: "pnpm --filter @neore/desktop run smoke:artifacts -- --unpacked-only"

            # Launches the real shell: a terminal opens, runs a command and survives a reload, and every
            # shell is gone after quit. Only the terminal cases run here; the rest of the suite is not green yet.
            - name: "Run the terminal end-to-end tests"
              run: "pnpm --filter @neore/desktop exec playwright test --grep terminal"

    test-required-check:
        needs: ["files-changed", "test", "rust-worker", "e2e", "device-core", "desktop-package", "desktop-macos-check", "desktop-windows-check"]
        name: "Check Test Run"
        # `always()` and nothing else: a job skipped by its own `if:` reports
        # success to a ruleset, so gating this one on its needs' results made the
        # required check disappear (= pass) exactly when `test` or `e2e` failed.
        if: "always()"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 5
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Check for failures"
              if: "contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')"
              run: |
                  echo "One of the dependent jobs have failed. You may need to re-run it." && exit 1

name: "AlloAllo"

on: # yamllint disable-line rule:truthy
    issues:
        types:
            - "opened"
    pull_request_target:
        branches:
            - "main"
        types:
            - "opened"
            - "closed"

permissions: {}

jobs:
    allo-allo:
        # A called workflow cannot ask for more than its caller grants, and the
        # repository default token is read-only: without this block the run dies
        # with `startup_failure` before any job starts.
        permissions:
            contents: "read"
            issues: "write"
            pull-requests: "write"
        uses: "anolilab/workflows/.github/workflows/allo-allo.yml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            target-repo: "anolilab/neore"
            onboarding-lead: "prisis"

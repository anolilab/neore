# Packages the Electron desktop shell (`apps/desktop`) for macOS (arm64 and x64),
# Windows (x64 and arm64) and Linux (x64 and arm64) when a `desktop-v*` tag is pushed,
# and attaches the installers to a DRAFT prerelease. Replaces `native.yml` (the Tauri
# shell, now deleted).
#
# One job per platform. Linux x64 and arm64 are separate jobs, each on a native runner, and
# each builds the device-execution addon for its own architecture. macOS and Windows build
# both of their arches in one electron-builder run: macOS from `mac.target`, Windows from
# `win.target`. Both jobs cross-compile the second addon (macOS x64, Windows arm64), so every
# installer carries the addon for its arch.
#
# The update feed (`latest*.yml`). A single electron-builder run writes one feed per platform,
# so macOS (`latest-mac.yml`) and Windows (`latest.yml`) each list both arches. Linux arm64
# writes `latest-linux-arm64.yml`, separate from x64. Splitting macOS or Windows across jobs
# would make two jobs write the same feed file.
#
# Runner labels: `windows-latest`, `ubuntu-22.04`, `ubuntu-22.04-arm` and `macos-latest`.
# `ubuntu-22.04-arm` is a GitHub-hosted arm64 label; check it is available to this repository.
#
# Unverified: the Windows arm64 addon is cross-compiled on the x64 `windows-latest` runner. That
# needs the `aarch64-pc-windows-msvc` Rust target and an MSVC ARM64 linker/libraries on the image.
# Neither was checked against the runner image or the repo's Rust CI (there is none for it).
# If the link fails, the Windows leg fails before packaging.
#
# SIGNING. Windows uses Authenticode. electron-builder reads `WIN_CSC_LINK` and
# `WIN_CSC_KEY_PASSWORD` from the environment. With neither set the installer is unsigned.
# Those two secrets are passed to the packaging step only, and that step drops them when
# they are empty: electron-builder treats an empty string as a set value and fails, instead
# of skipping signing. macOS is still unsigned: it needs an Apple Developer ID and
# notarization. Unsigned macOS builds are blocked
# by Gatekeeper, and unsigned Windows installers trip SmartScreen, so the release is still
# internal until both are in place. Drop the "unsigned" wording from the release notes then.
#
# Known blocker: the macOS packaging depends on the `@xmldom/xmldom` override in
# `pnpm-workspace.yaml`. If the packager fails there, the macOS leg fails until the
# owner decides how to resolve it. The other legs are not affected by it.

name: "Desktop build"

on: # yamllint disable-line rule:truthy
    push:
        tags:
            - "desktop-v*"

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: false

permissions:
    contents: "read"

jobs:
    build:
        name: "Package (${{ matrix.name }}-${{ matrix.arch }})"
        strategy:
            fail-fast: false
            matrix:
                include:
                    - name: "macos"
                      arch: "universal"
                      runner: "macos-latest"
                      # arm64 and x64 both come from `mac.target` in electron-builder.yml.
                      args: "--mac"
                      artifact: "desktop-macos"
                    - name: "windows"
                      arch: "x64+arm64"
                      runner: "windows-latest"
                      # Both arches in one run, so electron-builder writes one `latest.yml` listing both.
                      args: "--win --x64 --arm64"
                      artifact: "desktop-windows"
                    - name: "linux"
                      arch: "x64"
                      runner: "ubuntu-22.04"
                      args: "--linux --x64"
                      artifact: "desktop-linux-x64"
                    - name: "linux"
                      arch: "arm64"
                      runner: "ubuntu-22.04-arm"
                      args: "--linux --arm64"
                      artifact: "desktop-linux-arm64"
        runs-on: "${{ matrix.runner }}"
        timeout-minutes: 60
        env:
            # Set on the build so `scripts/build.mjs` refuses to produce a release
            # without the site origin, and bakes the origin in.
            NEORE_RELEASE: "1"
            # The deployment the shell wraps. A repository VARIABLE, not a secret:
            # it is the site's public URL.
            NEORE_SITE_URL: "${{ vars.DESKTOP_SITE_URL }}"
        permissions:
            contents: "read"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "22"
                  skip-playwright: "true"

            # The device-execution addon (`packages/device-core-node`, Rust via napi) is
            # loaded by the shell at runtime. Without it the installer ships with the
            # addon missing, and the failure is silent until a device call runs.
            - name: "Install Rust (stable)"
              uses: "dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8" # master
              with:
                  toolchain: "stable"

            # No Rust build cache here: this workflow runs only on tags and publishes what it
            # builds, and zizmor's cache-poisoning audit flags any cache a release restores,
            # whether or not it is saved. A cold build is slower and that is the price.

            # The Linux keyring backend (`keyring`'s Secret Service) links libdbus at build time.
            - name: "Install libdbus for the Linux keyring"
              if: "matrix.name == 'linux'"
              run: "sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config"

            - name: "Add the x64 macOS Rust target"
              if: "matrix.name == 'macos'"
              run: "rustup target add x86_64-apple-darwin"

            - name: "Add the arm64 macOS Rust target"
              if: "matrix.name == 'macos'"
              run: "rustup target add aarch64-apple-darwin"

            - name: "Add the arm64 Windows Rust target"
              if: "matrix.name == 'windows'"
              run: "rustup target add aarch64-pc-windows-msvc"

            # Builds for the runner's own architecture: x64 on Windows, the matrix arch on Linux.
            - name: "Build the device-execution addon for the runner's architecture"
              run: "pnpm --filter @neore/device-core-node run build"

            # `mac.target` ships x64 as well as arm64, and each Electron app needs the addon for its own arch.
            # Both are built explicitly, so the package does not depend on which arch the runner happens to be.
            - name: "Build the device-execution addon for x64 (macOS)"
              if: "matrix.name == 'macos'"
              run: "pnpm --filter @neore/device-core-node run build -- --target x86_64-apple-darwin"

            - name: "Build the device-execution addon for arm64 (macOS)"
              if: "matrix.name == 'macos'"
              run: "pnpm --filter @neore/device-core-node run build -- --target aarch64-apple-darwin"

            # `win.target` ships arm64 as well as x64. Cross-compiled here, unverified: see the header.
            - name: "Build the device-execution addon for arm64 (Windows)"
              if: "matrix.name == 'windows'"
              run: "pnpm --filter @neore/device-core-node run build -- --target aarch64-pc-windows-msvc"

            # The packaged version is the tag's (`desktop-v1.2.3` → `1.2.3`): electron-updater compares
            # versions, so a `0.0.0` installer would never be offered as an update. Runner-only, not committed.
            - name: "Set the packaged version from the tag"
              shell: "bash"
              env:
                  TAG: "${{ github.ref_name }}"
              run: |
                  version="${TAG#desktop-v}"
                  if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
                      echo "Tag $TAG does not carry a semver version" >&2
                      exit 1
                  fi
                  node -e "const fs = require('node:fs'); const file = 'apps/desktop/package.json'; const pkg = JSON.parse(fs.readFileSync(file, 'utf8')); pkg.version = process.argv[1]; fs.writeFileSync(file, JSON.stringify(pkg, null, 4) + '\n');" "$version"

            # On-device dictation (plans/desktop-dictation.md): whisper.cpp at its pinned commit, built for the runner's
            # architecture. Linux builds on the oldest runner it ships from and fails if the helper needs a newer glibc
            # than that. Windows builds the x64 helper only: Windows on ARM is not offered (`unsupportedReason` in
            # `src/dictation/catalog.ts`) until its clang-cl build measures inside the budget, and then this step gains
            # `-- --arch arm64` and `smoke:artifacts` counts both. The Intel macOS app ships without a helper.
            - name: "Build the on-device speech helper (macOS arm64)"
              if: "matrix.name == 'macos'"
              run: "pnpm --filter @neore/desktop run build:dictation-helper"

            - name: "Build the on-device speech helper (Windows x64)"
              if: "matrix.name == 'windows'"
              run: "pnpm --filter @neore/desktop run build:dictation-helper -- --arch x64"

            - name: "Build the on-device speech helper (Linux)"
              if: "matrix.name == 'linux'"
              run: "pnpm --filter @neore/desktop run build:dictation-helper -- --max-glibc 2.35"

            - name: "Bundle the main process and preloads"
              run: "pnpm --filter @neore/desktop run build"

            - name: "Smoke-test the bundles and the addon"
              run: "pnpm --filter @neore/desktop run smoke"

            # Authenticode: the cert variables are dropped when empty (see the header).
            # Bash on every runner, including Windows (Git Bash), so one script covers all legs.
            - name: "Package with electron-builder"
              shell: "bash"
              env:
                  WIN_CSC_LINK: "${{ secrets.WIN_CSC_LINK }}"
                  WIN_CSC_KEY_PASSWORD: "${{ secrets.WIN_CSC_KEY_PASSWORD }}"
              run: |
                  if [ -z "$WIN_CSC_LINK" ]; then
                      unset WIN_CSC_LINK WIN_CSC_KEY_PASSWORD
                  fi
                  pnpm --filter @neore/desktop exec electron-builder --config electron-builder.yml --publish never ${{ matrix.args }}

            - name: "Check the release artifacts"
              run: "pnpm --filter @neore/desktop run smoke:artifacts"

            - name: "Upload installers"
              uses: "actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02" # v4.6.2
              with:
                  name: "${{ matrix.artifact }}"
                  if-no-files-found: "error"
                  retention-days: 7
                  path: |
                      apps/desktop/release/*.dmg
                      apps/desktop/release/*.zip
                      apps/desktop/release/*.exe
                      apps/desktop/release/*.AppImage
                      apps/desktop/release/*.deb
                      apps/desktop/release/latest*.yml
                      apps/desktop/release/*.blockmap

    release:
        name: "Draft prerelease"
        needs: build
        runs-on: "ubuntu-latest"
        timeout-minutes: 15
        # Reading the run's artifacts needs `actions: read`; writing the release needs `contents: write`.
        permissions:
            contents: "write"
            actions: "read"
        env:
            GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
            GH_REPO: "${{ github.repository }}"
            RUN_ID: "${{ github.run_id }}"
            TAG: "${{ github.ref_name }}"
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Download the installers from this run"
              run: |
                  gh run download "$RUN_ID" --pattern "desktop-*" --dir assets
                  find assets -type f | sort

            - name: "Create the draft prerelease, or refresh its assets"
              run: |
                  if ! gh release view "$TAG" >/dev/null 2>&1; then
                      gh release create "$TAG" \
                          --draft \
                          --prerelease \
                          --title "Neore desktop $TAG" \
                          --notes "Unsigned test build. See apps/desktop/electron-builder.yml."
                  fi
                  gh release upload "$TAG" assets/*/* --clobber

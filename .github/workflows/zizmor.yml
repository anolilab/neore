name: "Zizmor"
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
permissions: {}

concurrency:
    group: "${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}"
    cancel-in-progress: "${{ github.event_name == 'pull_request' }}"

jobs:
    zizmor:
        permissions:
            security-events: "write"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/zizmor.yml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            min_severity: "medium"

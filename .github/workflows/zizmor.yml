name: "Zizmor"
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
permissions: {}

# No `concurrency` here: the shared workflow sets its own, and a caller group equal to
# the callee's ("<workflow>-<PR number>") deadlocks the run into a startup failure.
jobs:
    zizmor:
        permissions:
            security-events: "write"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/zizmor.yml@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
        with:
            min_severity: "medium"

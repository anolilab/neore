name: "Zizmor"
on:
    push:
        branches: ["main"]
    pull_request:
        branches: ["main"]
permissions: {}

# No `concurrency` here: the shared workflow sets its own, and a caller group equal to
# the callee's ("<workflow>-<PR number>") deadlocks the run into a startup failure.
jobs:
    zizmor:
        permissions:
            security-events: "write"
            contents: "read"
        uses: "anolilab/workflows/.github/workflows/zizmor.yml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            min_severity: "medium"

name: "Label Idle Issues"

on: # yamllint disable-line rule:truthy
    schedule:
        - cron: "0 0 * * *"

permissions: {}

jobs:
    stale-issues:
        permissions:
            contents: "read"
            issues: "write"
            pull-requests: "write"
        uses: "anolilab/workflows/.github/workflows/stale-issues.yml@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
        with:
            target-repo: "anolilab/neore"

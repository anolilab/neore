# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Bundle budget"

on: # yamllint disable-line rule:truthy
    # eslint-disable-next-line yml/no-empty-mapping-value
    pull_request: # yamllint disable-line rule:empty-values
        types: ["opened", "synchronize", "reopened"]
    merge_group: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read" # to fetch code (actions/checkout)

jobs:
    # Measures the web client's first-load JavaScript and fails the PR when it
    # grows past the budget in scripts/check-web-bundle.ts. Nothing else on a pull
    # request measured this: the Worker upload cap is checked only at deploy.
    bundle:
        name: "Web client bundle"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 20
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411" # v2.19.4
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd" # v6.0.2
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@995b5d6f54bf41c2b33dddade556c723ba3003ad" # v24.1.1
              with:
                  node-version: "24.22.1"
                  npm-version: "11"

            - name: "Build workspace packages"
              shell: "bash"
              run: "pnpm run build:packages"

            # The client build only reads these to validate its env schema; the
            # values are not deployed. Same placeholders as the E2E job.
            - name: "Build the web client"
              shell: "bash"
              env:
                  NODE_OPTIONS: "--max-old-space-size=4096"
                  VITE_LUNORA_URL: "http://localhost:8788"
                  VITE_SITE_URL: "http://localhost:5173"
                  VITE_LLM_GATEWAY_URL: "http://localhost:5173/llm-gateway"
              run: "pnpm --filter @neore/web exec vite build"

            - name: "Check the web client bundle budget"
              shell: "bash"
              run: "pnpm exec tsx scripts/check-web-bundle.ts"

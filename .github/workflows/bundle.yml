# https://help.github.com/en/categories/automating-your-workflow-with-github-actions

name: "Bundle budget"

on: # yamllint disable-line rule:truthy
    # eslint-disable-next-line yml/no-empty-mapping-value
    pull_request: # yamllint disable-line rule:empty-values
        types: ["opened", "synchronize", "reopened"]
    merge_group: # yamllint disable-line rule:empty-values

concurrency:
    group: "${{ github.workflow }}-${{ github.ref }}"
    cancel-in-progress: true

permissions:
    contents: "read" # to fetch code (actions/checkout)

jobs:
    # Measures the web client's first-load JavaScript and fails the PR when it
    # grows past the budget in scripts/check-web-bundle.ts. Nothing else on a pull
    # request measured this: the Worker upload cap is checked only at deploy.
    bundle:
        name: "Web client bundle"
        runs-on: "ubuntu-24.04"
        timeout-minutes: 20
        steps:
            - name: "Harden Runner"
              uses: "step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43" # v2.22.3
              with:
                  egress-policy: "audit"

            - name: "Git checkout"
              uses: "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1" # v7.0.1
              with:
                  persist-credentials: false

            - name: "Setup resources and environment"
              uses: "anolilab/workflows/step/setup@1f3a7f7e561f7690fe19dea5d2ed225def53c908" # v26.0.6
              with:
                  enable-nx-cache: "false" # no Nx in this repo: the cache never hits
                  node-version: "24.22.1"
                  npm-version: "11"

            - name: "Build workspace packages"
              shell: "bash"
              run: "pnpm run build:packages"

            # The client build only reads these to validate its env schema; the
            # values are not deployed. Same placeholders as the E2E job.
            - name: "Build the web client"
              shell: "bash"
              env:
                  NODE_OPTIONS: "--max-old-space-size=4096"
                  VITE_LUNORA_URL: "http://localhost:8788"
                  VITE_SITE_URL: "http://localhost:5173"
                  VITE_LLM_GATEWAY_URL: "http://localhost:5173/llm-gateway"
              run: "pnpm --filter @neore/web exec vite build"

            - name: "Check the web client bundle budget"
              shell: "bash"
              run: "pnpm exec tsx scripts/check-web-bundle.ts"

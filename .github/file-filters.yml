# This is used by the action https://github.com/dorny/paths-filter (which we have forked to https://github.com/getsentry/paths-filter)

frontend_lintable:
    - "**/*.[tj]{s,sx}"
    - "**/tsconfig*.json"
    - "**/package.json"
    - "pnpm-lock.yaml"

package_json_lintable:
    - "**/package.json"
    - "package.json"

markdown_lintable:
    - "**/*.md"
    - "**/*.mdx"
    - "**/package.json"
    - "pnpm-lock.yaml"

yaml_lintable:
    - "**/*.yml"
    - "**/*.yaml"
    - "pnpm-lock.yaml"

packages: &packages
    - "**/tsconfig*.json"
    - "pnpm-lock.yaml"
    - "package.json"
    - "apps/**"
    - "backend/**"
    - "packages/**"
    - "services/**"
    - "tools/**"
    - "vis.config.ts"
    - "pnpm-workspace.yaml"
    # The jobs themselves: a change to how tests run is tested by running them.
    - ".github/workflows/test.yml"
    - ".github/actions/**"
    - ".github/file-filters.yml"

# This is used by the action https://github.com/dorny/paths-filter (which we have forked to https://github.com/getsentry/paths-filter)

frontend_lintable:
    - "**/*.[tj]{s,sx}"
    - "**/tsconfig*.json"
    - "**/package.json"
    - "pnpm-lock.yaml"

package_json_lintable:
    - "**/package.json"
    - "package.json"

markdown_lintable:
    - "**/*.md"
    - "**/*.mdx"
    - "**/package.json"
    - "pnpm-lock.yaml"

yaml_lintable:
    - "**/*.yml"
    - "**/*.yaml"
    - "pnpm-lock.yaml"

# What the browser suite exercises: the web app, the backend, the gateway and the
# packages they build on. The CLI, the extension and the native shell are not in it.
e2e:
    - "apps/web/**"
    - "backend/**"
    - "packages/**"
    - "services/**"
    - "**/tsconfig*.json"
    - "pnpm-lock.yaml"
    - "pnpm-workspace.yaml"
    - "package.json"
    - "vis.config.ts"
    # The backend's launcher under Playwright's webServer in CI.
    - "scripts/dev-backend-watchdog.sh"
    - ".github/workflows/test.yml"
    - ".github/actions/**"
    - ".github/file-filters.yml"

packages: &packages
    - "**/tsconfig*.json"
    - "pnpm-lock.yaml"
    - "package.json"
    - "apps/**"
    - "backend/**"
    - "packages/**"
    - "services/**"
    - "tools/**"
    - "vis.config.ts"
    - "pnpm-workspace.yaml"
    # The jobs themselves: a change to how tests run is tested by running them.
    - ".github/workflows/test.yml"
    - ".github/actions/**"
    - ".github/file-filters.yml"

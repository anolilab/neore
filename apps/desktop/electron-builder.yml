# Packaging for the Neore desktop shell. Built by `pnpm --filter @neore/desktop run dist`
# (after `NEORE_SITE_URL` is set; see scripts/build.mjs). Signing is picked up from the
# environment, not from this file: the variable names are in `.env.signing.example`.
# With none of them set the build is unsigned, and unsigned builds run only where the
# OS allows it (on macOS: right-click → Open; SmartScreen warns on Windows).
appId: de.anolilab.neore
productName: Neore
copyright: Copyright © Anolilab
directories:
    buildResources: build
    output: release
# Everything the app loads at runtime lives in dist/ (main, preloads, Quick Composer page, tray icon).
files:
    - dist/**/*
    - package.json
    # The device-execution addon (`@neore/device-core-node`) is a production dependency, so
    # electron-builder packs it from node_modules. Its Rust sources, build output and dev
    # tooling are not needed at runtime (`target/` alone is hundreds of MB).
    - "!node_modules/@neore/device-core-node/{src,target,node_modules,Cargo.toml,Cargo.lock,build.rs}{,/**/*}"
    # The terminal's PTY library (`node-pty`) runs from the host process. Its C++ sources, vendored deps and
    # build files are not needed at runtime; the prebuilt binaries (or the Linux build output) are.
    - "!node_modules/node-pty/{src,deps,third_party,scripts,binding.gyp}{,/**/*}"
asar: true
# node-pty ships N-API binaries for macOS (both archs) and Windows, and builds on Linux at install time. They are
# valid for Electron as they are, and a rebuild here would produce the runner's arch only (a mac x64 build on an
# arm64 runner would get an arm64 binary, which node-pty prefers over the right prebuild). The other native
# dependency, `device-core-node`, is prebuilt by its own step and has nothing to rebuild.
npmRebuild: false
# A `.node` binary is dlopen'd from disk and cannot be loaded from inside the asar archive. node-pty also
# executes its `spawn-helper` to start a shell, and an executable cannot run from inside the archive either. On
# Windows its worker thread script is better a real file too, so the host loads node-pty from the unpacked copy
# (`loadableDirectory` in `src/terminal/spawn-helper.ts`); the whole folder is unpacked for that.
asarUnpack:
    - "**/*.node"
    - "**/node-pty/**"
afterPack: scripts/after-pack.cjs
# The custom scheme: installers register it (macOS from Info.plist, Windows in the installer, Linux via the .desktop file).
protocols:
    - name: Neore
      role: Viewer
      schemes:
          - neore
mac:
    category: public.app-category.productivity
    icon: build/icon.png
    target:
        - target: dmg
          arch: [arm64, x64]
        # The zip is what the macOS updater downloads; electron-updater needs it next to the dmg.
        - target: zip
          arch: [arm64, x64]
    hardenedRuntime: true
    entitlements: build/entitlements.mac.plist
    entitlementsInherit: build/entitlements.mac.plist
    extendInfo:
        # The web app's voice input asks for the microphone; without this key macOS denies it silently.
        NSMicrophoneUsageDescription: Neore uses the microphone for voice input when you start dictation.
# Windows code signing is Authenticode (decided), not Azure Trusted Signing. electron-builder
# reads WIN_CSC_LINK and WIN_CSC_KEY_PASSWORD from the environment; unset, the installer is unsigned.
win:
    icon: build/icon.ico
    target:
        - target: nsis
          arch: [x64, arm64]
nsis:
    oneClick: false
    perMachine: false
    allowToChangeInstallationDirectory: true
linux:
    executableName: neore
    category: Office
    icon: build/icon.png
    target:
        - target: AppImage
          arch: [x64, arm64]
        - target: deb
          arch: [x64, arm64]
# The update feed: GitHub Releases, read by electron-updater as latest*.yml. Local builds never publish.
publish:
    provider: github
    owner: anolilab
    repo: neore
    releaseType: draft

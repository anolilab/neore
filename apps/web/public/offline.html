<!doctype html>
<!--
    The service worker's answer to a navigation the network could not serve
    (scripts/generate-sw.mjs, `precacheFallback`). Static and user-agnostic by
    design: SSR HTML carries the viewer's dehydrated data and RPC token, so it
    is never cached — this page is the only thing an offline start can show.
-->
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#191919" />
        <title>Offline · Neore</title>
        <link rel="icon" href="/favicon.ico" />
        <style>
            :root {
                color-scheme: dark light;
                font-family:
                    system-ui,
                    -apple-system,
                    "Segoe UI",
                    sans-serif;
            }
            body {
                margin: 0;
                min-height: 100vh;
                display: grid;
                place-items: center;
                background: #212121;
                color: #ececec;
                padding: 16px;
                box-sizing: border-box;
            }
            main {
                max-width: 28rem;
                text-align: center;
            }
            h1 {
                font-size: 1.25rem;
                margin: 0 0 0.5rem;
            }
            p {
                margin: 0 0 1.5rem;
                color: #b4b4b4;
                line-height: 1.5;
            }
            a {
                display: inline-block;
                padding: 0.5rem 1rem;
                border-radius: 0.5rem;
                background: #ececec;
                color: #191919;
                text-decoration: none;
                font-weight: 500;
            }
            a:focus-visible {
                outline: 2px solid #8ab4f8;
                outline-offset: 2px;
            }
        </style>
    </head>
    <body>
        <main>
            <img src="/pwa-icon.svg" alt="" role="presentation" width="48" height="48" />
            <h1>You are offline</h1>
            <p>Neore could not reach the network. Check your connection and try again.</p>
            <a href="">Try again</a>
        </main>
    </body>
</html>
